[package]
name = "fips-v2-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The mesh library for the app (JNI on Android, C ABI in nvfips.h on iOS): upstream FIPS embedded in-process with an
# app-owned TUN, and fips-v2's smoltcp stack (included by path, not copied).
[lib]
name = "nvfips"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Our fork: upstream maint (which now carries our dual-init offer re-send) plus
# leaf-only mode, the leaf self-root fix and embedded add_peer. Back to a
# jmcorgan/fips tag once one includes them.
fips = { git = "https://github.com/btcforplebs/fips", rev = "d6f075b2" }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zeroize = "1"
socket2 = "0.6"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-android = "0.2"

[profile.release]
lto = "thin"
strip = true
