[package]
name = "fips-v2-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The mesh library for the app (JNI on Android, C ABI in nvfips.h on iOS): upstream FIPS embedded in-process with an
# app-owned TUN, and fips-v2's smoltcp stack (included by path, not copied).
[lib]
name = "nvfips"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Our fork: v0.5.2 plus leaf-only mode and the dual-init offer re-send, both
# headed upstream, and the datagram API built on Android and iOS (dbb6c848,
# branch nv/native-api-mobile) for the browser relay link. Back to a jmcorgan/fips tag once they land in a release.
fips = { git = "https://github.com/btcforplebs/fips", rev = "8e21e513" }
# The browser relay protocol (NIP-01 over TCP/FIPS 7447), over this node's
# datagram API: relay_link.rs.
web-relay-vault = { path = "../web-relay-vault" }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zeroize = "1"
socket2 = "0.6"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-android = "0.2"

[profile.release]
lto = "thin"
strip = true

