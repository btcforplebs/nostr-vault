[package]
name = "fipsv2-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Upstream FIPS (jmcorgan). Git-only; pin a release tag, never a branch.
[dependencies]
# Our fork: v0.5.2 plus leaf-only mode and the dual-init offer re-send, both
# headed upstream. Back to a jmcorgan/fips tag once they land in a release.
fips = { git = "https://github.com/btcforplebs/fips", rev = "ff355b84" }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow = "1"
socket2 = "0.6"
getrandom = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
