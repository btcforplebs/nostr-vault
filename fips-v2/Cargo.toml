[package]
name = "fipsv2-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Upstream FIPS (jmcorgan). Git-only; pin a release tag, never a branch.
[dependencies]
# Our fork, branch nv/v0.5.3: v0.5.3 plus the native API built on Android and
# iOS, offer_allowlist and reserved_npubs. Same rev as fips-v2-android and
# web-relay-vault. Back to a jmcorgan/fips tag once they land in a release.
fips = { package = "fips-mesh", git = "https://github.com/btcforplebs/fips", rev = "2cad66d8" }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow = "1"
sha2 = "0.10"
socket2 = "0.6"
getrandom = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
