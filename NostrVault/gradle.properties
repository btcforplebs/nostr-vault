org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 turns on R8 strict full mode, where a bare `-keep class X` no longer
# keeps X's no-arg constructor. Library rules still rely on the old meaning:
# WorkManager's Room database and ML Kit's component registrars are created
# by reflection and failed at startup (release only). Keep the old meaning
# until every reflective class has a `{ <init>(); }` rule; AGP 10 removes this.
android.r8.strictFullModeForKeepRules=false
