# Standalone UI test for the iPhone feed top bar. It drives the installed
# Nostr Vault app (com.havenapp.relay) on a simulator; the Host app exists
# only because a UI test bundle needs one. See README.md.
name: FeedTopBarUITests
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenapp.feedtopbaruitests.host
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  UIT:
    type: bundle.ui-testing
    platform: iOS
    sources: [UIT]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenapp.feedtopbaruitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Host
        CODE_SIGNING_ALLOWED: NO
  HostMac:
    type: application
    platform: macOS
    sources: [HostMac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenapp.feedtopbaruitests.hostmac
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  UITMac:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITMac]
    dependencies:
      - target: HostMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenapp.feedtopbaruitests.mac
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HostMac
        CODE_SIGNING_ALLOWED: NO
schemes:
  UIT:
    build:
      targets: {UIT: all, Host: all}
    test:
      targets: [UIT]
  UITMac:
    build:
      targets: {UITMac: all, HostMac: all}
    test:
      targets: [UITMac]
