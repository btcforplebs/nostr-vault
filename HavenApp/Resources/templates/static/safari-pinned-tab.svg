<?xml version="1.0" encoding="UTF-8"?>
<!--
  Safari pinned-tab mask: one black silhouette of the lit arch, no gradients.
  Path data and group transform are copied verbatim from the Android themed
  icon layer (NostrVault/app/src/main/res/drawable/ic_launcher_monochrome.xml),
  which is the same mark already used for Android notifications: outer arch,
  opening cut out, keyhole filled back in by evenodd.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(0,-36) translate(512,548) scale(0.827) translate(-512,-548)">
    <path fill="#000000" fill-rule="evenodd"
          d="M 262 876 L 262 470 A 250 250 0 0 1 762 470 L 762 876 Z
             M 352 876 L 352 488 A 160 160 0 0 1 672 488 L 672 876 Z
             M 472 742 a 40 40 0 1 0 80 0 a 40 40 0 1 0 -80 0 Z"/>
  </g>
</svg>
