<title>Nostr Vault Browser Relay</title>
<style>html,body{color:#ddd;background:#000;margin:0;font:15px -apple-system,system-ui,sans-serif}main{padding:max(16px,env(safe-area-inset-top)) 16px 16px}h1{margin:0 0 8px;font-size:18px}.big{color:#7cfc9a;font:600 44px ui-monospace,monospace}.row{flex-wrap:wrap;gap:16px;margin:8px 0;display:flex}.k{color:#888;text-transform:uppercase;font-size:12px}button{color:#eee;background:#1a1a1a;border:1px solid #444;border-radius:8px;margin:4px 4px 4px 0;padding:10px 14px;font-size:16px}#saver{text-align:center;background:#000;flex-direction:column;justify-content:center;align-items:center;display:none;position:fixed;inset:0}#saver.on{display:flex}pre{white-space:pre-wrap;color:#9a9a9a;max-height:40vh;font:11px ui-monospace,monospace;overflow:auto}</style>
  <script type="module" crossorigin src="/relay/assets/index-c2_FcHQv.js"></script>
</head>
<body>
<main>
  <h1>Nostr Vault Browser Relay</h1>
  <div class="row">
    <div><div class="k">events</div><div id="count" class="big">–</div></div>
    <div><div class="k">uptime</div><div id="uptime" class="big">–</div></div>
  </div>
  <div id="status"></div>
  <div>
    <button id="start">Start screensaver</button>
    <button id="gen">Generator: off</button>
    <button id="burst">+1000 events</button>
    <button id="report">Report</button>
    <button id="copyrep">Copy report</button>
    <button id="copy">Copy log</button>
  </div>
  <h2 style="font-size:15px;margin:16px 0 4px">FIPS (NIP-01 on port 7447, owner only)</h2>
  <textarea id="fipsOwners" rows="2" placeholder="Your vault's npub (one per line)" style="width:100%;box-sizing:border-box;background:#111;color:#ddd;border:1px solid #444;border-radius:8px;padding:8px;font:12px ui-monospace,monospace"></textarea>
  <div><button id="fipsSave">Save owners</button><button id="fipsStart">Start FIPS</button></div>
  <pre id="fipsStatus"></pre>
  <pre id="info"></pre>
  <pre id="log"></pre>
</main>
<div id="saver">
  <div class="k">relay running</div>
  <div id="scount" class="big">–</div>
  <div class="k">events</div>
  <div id="suptime" class="big" style="font-size:32px;margin-top:16px">–</div>
  <div class="k">uptime · tap to exit</div>
  <div id="slock" class="k" style="margin-top:16px"></div>
  <div id="sfips" class="k" style="margin-top:8px"></div>
</div>
