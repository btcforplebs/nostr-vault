# Served by the nginx:alpine image built from website/Dockerfile.
# Copied to /etc/nginx/conf.d/default.conf.

# Security headers (Tron's web Vault review, RESEARCH/NV_WEB_VAULT_BUG_REVIEW_2026_10_20.md). /vault/ and /relay/ share
# this origin with the site pages, so a script injected into any page could read the vault's session, device key,
# sealed signer key, wallet link and IndexedDB. The CSP lets no script run but the site's own files, and no page be
# framed (click-jacking Post / Zap / Block). The apps also need WebAssembly (haven.wasm), relays (wss:), and https: for
# zap services, Blossom and media; a zap service may be http to an onion (web-vault/src/net/zaps.js).
# Inline styles stay allowed: Preact sets style attributes, and the site pages and the vault draw <style> blocks.
map $uri $nv_csp {
    # The public post page (/thread/, drawn by the thread service) shows the post's images and video from wherever the
    # author put them. Its one script is the site's own /relay/share-photos.js (and the reader chunk it imports from
    # /relay/assets/): a photo of the shared post its server can't serve is read over FIPS through the public seeds
    # only (connect-src, kept equal to web-relay PUBLIC_SEEDS by web-vault/test/thread-page-mesh.test.mjs) and shown
    # as a blob: image. No worker, no wasm.
    ~^/thread/         "default-src 'none'; script-src https://nostrvault.app/relay/share-photos.js https://nostrvault.app/relay/assets/; img-src 'self' https: data: blob:; media-src https:; connect-src wss://fips1.iris.to wss://fips2.iris.to; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/(relay|vault)/  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss: http://*.onion; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    default            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The web apps' build writes a .gz next to each asset (haven.wasm is ~27 MB raw); serve that instead.
    # nginx:alpine has no brotli module, so the hashed assets serve their .br by hand (the assets/ locations):
    # haven.wasm is 4.4 MB as .br against 6.0 MB as .gz.
    gzip_static on;
    gzip_vary on;

    # The four security headers. nginx drops these in any location that sets an add_header of its own, so each
    # location below repeats them.
    add_header Content-Security-Policy $nv_csp always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # NIP-05: identity lookup must be readable cross-origin by Nostr clients.
    location = /.well-known/nostr.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Public post pages, nostrvault.app/thread/<nevent|note|naddr>: what the apps' Share and Copy link point at. The
    # thread service (web-vault/thread-page/, a container beside this one in docker-compose.yml) reads the post and its
    # replies from public relays and draws them with og: tags, so the link opens signed out and unfurls in chats.
    # The name is looked up per request (Docker's DNS), so nginx starts even while the thread container is down.
    location ^~ /thread/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nv_thread http://thread:8790;
        proxy_pass $nv_thread;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # The .br the assets location below picks, with its asset's type (nginx would type it by ".br"). Listed first: the
    # first regex location that matches wins, and the assets one matches these too.
    location ~ ^/(relay|vault)/assets/.+\.br$ {
        gzip_static off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location ~ \.wasm\.br$ { default_type application/wasm; }
        location ~ \.m?js\.br$ { default_type application/javascript; }
        location ~ \.css\.br$ { default_type text/css; }
        location ~ \.svg\.br$ { default_type image/svg+xml; }
        location ~ \.json\.br$ { default_type application/json; }
    }

    # The web apps' assets/ names carry a content hash, so they never change (as web-relay/server.mjs serves them).
    # A client that takes brotli gets the asset's .br when the build wrote one.
    location ~ ^/(relay|vault)/assets/ {
        set $nv_br "";
        if ($http_accept_encoding ~* "(^|[\s,])br($|[\s,;])") { set $nv_br "a"; }
        if (-f $request_filename.br) { set $nv_br "${nv_br}f"; }
        if ($nv_br = af) { rewrite ^(.*)$ $1.br last; }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # The rest of the apps (index.html, sw.js, the unhashed haven.wasm) revalidates (ETag), so a new
    # index.html or sw.js is never held past a deploy that removed the hashed assets the old one points at.
    location ~ ^/(relay|vault)/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Site pages revalidate too. `index index.html` re-runs location matching, so /, /relay/ and /vault/ land here.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # No Cache-Control here: video, screenshots, CSS and JS stay cacheable at the Cloudflare edge.
    location / {
        try_files $uri $uri/ =404;
    }
}
