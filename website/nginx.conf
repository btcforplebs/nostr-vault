# Served by the nginx:alpine image built from website/Dockerfile.
# Copied to /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The web apps' build writes a .gz next to each asset (haven.wasm is ~27 MB raw); serve that instead.
    # nginx:alpine has no brotli module, so the .br files sit unused.
    gzip_static on;
    gzip_vary on;

    # NIP-05: identity lookup must be readable cross-origin by Nostr clients.
    location = /.well-known/nostr.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # The web apps' assets/ names carry a content hash, so they never change (as web-relay/server.mjs serves them).
    location ~ ^/(relay|vault)/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else revalidates (ETag), so a new index.html or sw.js is never held past a deploy
    # that removed the hashed assets the old one points at.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
