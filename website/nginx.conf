# Served by the nginx:alpine image built from website/Dockerfile.
# Copied to /etc/nginx/conf.d/default.conf.

# Security headers (Tron's web Vault review, RESEARCH/NV_WEB_VAULT_BUG_REVIEW_2026_10_20.md). /vault/ and /relay/ share
# this origin with the site pages, so a script injected into any page could read the vault's session, device key,
# sealed signer key, wallet link and IndexedDB. The CSP lets no script run but the site's own files, and no page be
# framed by another site (click-jacking Post / Zap / Block). The apps also need WebAssembly (haven.wasm), relays (wss:), and https: for
# zap services, Blossom and media; a zap service may be http to an onion (web-vault/src/net/zaps.js).
# Inline styles stay allowed: Preact sets style attributes, and the site pages and the vault draw <style> blocks.
map $uri $nv_csp {
    # The public post page (/thread/, drawn by the thread service) is for link previews: a browser is sent straight on
    # into the web app by its one script, the site's own /open-post.js. It shows the post's images and video from
    # wherever the author put them (no-JS readers). It connects to nothing. Checked by web-vault/test/thread-page.test.mjs.
    ~^/thread/         "default-src 'none'; script-src https://nostrvault.app/open-post.js; img-src 'self' https: data:; media-src https:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    # The public profile page (/p/, drawn by the same service) runs no script at all: its buttons are plain links
    # (nostrvault://p/<npub>, the site, nostr:). Checked by web-vault/test/profile-page.test.mjs.
    ~^/p/              "default-src 'none'; img-src 'self' https: data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/(relay|vault)/  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss: http://*.onion; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
    default            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

# The apps may be framed by the site's own pages and nothing else: nostrvault.app/ opens /vault/ in a frame and shrinks
# it into a phone on the marketing page (website/shell.js). Everything else stays unframeable.
map $uri $nv_xfo {
    ~^/(relay|vault)/  SAMEORIGIN;
    default            DENY;
}

# Access log: one file per UTC day inside the container (/var/log/nginx/site/access-YYYY-MM-DD.log), never Docker's
# stdout. log-prune.sh keeps only the last 7 days of files, and a redeploy starts with none (the files are in
# the container). website/privacy.html says so: change both together.
map $time_iso8601 $nv_log_day {
    "~^(?<day>\d{4}-\d{2}-\d{2})"  $day;
    default                         undated;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/site/access-$nv_log_day.log;
    # The error log is Docker's stderr (docker-compose.yml caps it); a missing file would put each visitor's IP there.
    log_not_found off;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects say "/vault/", not "http://host/vault/": Cloudflare in front speaks https, this server only http.
    absolute_redirect off;

    # The web apps' build writes a .gz next to each asset (haven.wasm is ~27 MB raw); serve that instead.
    # nginx:alpine has no brotli module, so the hashed assets serve their .br by hand (the assets/ locations):
    # haven.wasm is 4.4 MB as .br against 6.0 MB as .gz.
    gzip_static on;
    gzip_vary on;

    # The four security headers. nginx drops these in any location that sets an add_header of its own, so each
    # location below repeats them.
    add_header Content-Security-Policy $nv_csp always;
    add_header X-Frame-Options $nv_xfo always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # NIP-05: identity lookup must be readable cross-origin by Nostr clients.
    location = /.well-known/nostr.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # /v3/ was the 3.0 web app's preview; it is /vault/ now, same origin and the same browser storage, so a /v3/
    # visitor keeps their data. Old links go to /vault/ (the #/… part of the address rides along). An old /v3/ service
    # worker's update check gets website/v3/sw.js, which unregisters it so it stops serving the old app from cache.
    location = /v3/sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /v3 { return 301 /vault/$is_args$args; }
    location ^~ /v3/ { rewrite ^/v3/(.*)$ /vault/$1 permanent; }

    # Public post pages, nostrvault.app/thread/<nevent|note|naddr>: what the apps' Share and Copy link point at. The
    # thread service (web-vault/thread-page/, a container beside this one in docker-compose.yml) reads the post and its
    # replies from public relays and draws them with og: tags, so the link opens signed out and unfurls in chats.
    # The name is looked up per request (Docker's DNS), so nginx starts even while the thread container is down.
    location ^~ /thread/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nv_thread http://thread:8790;
        proxy_pass $nv_thread;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Public profile pages, nostrvault.app/p/<npub>: what the apps' Share profile QR code and link point at. Drawn by
    # the thread service too (web-vault/thread-page/profile-page.js), from the profile relays.
    location ^~ /p/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nv_thread http://thread:8790;
        proxy_pass $nv_thread;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # The .br the assets location below picks, with its asset's type (nginx would type it by ".br"). Listed first: the
    # first regex location that matches wins, and the assets one matches these too.
    location ~ ^/(relay|vault)/assets/.+\.br$ {
        gzip_static off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location ~ \.wasm\.br$ { default_type application/wasm; }
        location ~ \.m?js\.br$ { default_type application/javascript; }
        location ~ \.css\.br$ { default_type text/css; }
        location ~ \.svg\.br$ { default_type image/svg+xml; }
        location ~ \.json\.br$ { default_type application/json; }
    }

    # The web apps' assets/ names carry a content hash, so they never change (as web-relay/server.mjs serves them).
    # A client that takes brotli gets the asset's .br when the build wrote one.
    location ~ ^/(relay|vault)/assets/ {
        set $nv_br "";
        if ($http_accept_encoding ~* "(^|[\s,])br($|[\s,;])") { set $nv_br "a"; }
        if (-f $request_filename.br) { set $nv_br "${nv_br}f"; }
        if ($nv_br = af) { rewrite ^(.*)$ $1.br last; }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # The rest of the apps (index.html, sw.js, the unhashed haven.wasm) revalidates (ETag), so a new
    # index.html or sw.js is never held past a deploy that removed the hashed assets the old one points at.
    location ~ ^/(relay|vault)/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Site pages revalidate too. `index index.html` re-runs location matching, so /, /relay/ and /vault/ land here.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $nv_csp always;
        add_header X-Frame-Options $nv_xfo always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # No Cache-Control here: video, screenshots, CSS and JS stay cacheable at the Cloudflare edge.
    location / {
        try_files $uri $uri/ =404;
    }
}
