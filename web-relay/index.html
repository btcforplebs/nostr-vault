<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Nostr Vault Browser Relay</title>
<style>
  html,body{margin:0;background:#000;color:#ddd;font:15px -apple-system,system-ui,sans-serif}
  main{padding:max(16px,env(safe-area-inset-top)) 16px 16px}
  h1{font-size:18px;margin:0 0 8px}
  .big{font:600 44px ui-monospace,monospace;color:#7CFC9A}
  .row{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
  .k{color:#888;font-size:12px;text-transform:uppercase}
  button{font-size:16px;padding:10px 14px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#eee}
  #saver{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #saver.on{display:flex}
  pre{white-space:pre-wrap;font:11px ui-monospace,monospace;color:#9a9a9a;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<main>
  <h1>Nostr Vault Browser Relay</h1>
  <div class="row">
    <div><div class="k">events</div><div id="count" class="big">–</div></div>
    <div><div class="k">uptime</div><div id="uptime" class="big">–</div></div>
  </div>
  <div id="status"></div>
  <div>
    <button id="start">Start screensaver</button>
    <button id="gen">Generator: off</button>
    <button id="burst">+1000 events</button>
    <button id="report">Report</button>
    <button id="copyrep">Copy report</button>
    <button id="copy">Copy log</button>
  </div>
  <h2 style="font-size:15px;margin:16px 0 4px">FIPS (NIP-01 on port 7447, owner only)</h2>
  <textarea id="fipsOwners" rows="2" placeholder="Your vault's npub (one per line)" style="width:100%;box-sizing:border-box;background:#111;color:#ddd;border:1px solid #444;border-radius:8px;padding:8px;font:12px ui-monospace,monospace"></textarea>
  <div><button id="fipsSave">Save owners</button><button id="fipsStart">Start FIPS</button></div>
  <pre id="fipsStatus"></pre>
  <pre id="info"></pre>
  <pre id="log"></pre>
</main>
<div id="saver">
  <div class="k">relay running</div>
  <div id="scount" class="big">–</div>
  <div class="k">events</div>
  <div id="suptime" class="big" style="font-size:32px;margin-top:16px">–</div>
  <div class="k">uptime · tap to exit</div>
  <div id="slock" class="k" style="margin-top:16px"></div>
  <div id="sfips" class="k" style="margin-top:8px"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
