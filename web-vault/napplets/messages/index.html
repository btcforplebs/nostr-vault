<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages</title>
<style>
  :root { color-scheme: dark; --bg: #000; --s1: #1c1c1e; --s2: #2c2c2e; --s3: #3a3a3c; --text: #fff; --text-2: rgb(255 255 255 / .60); --text-3: rgb(255 255 255 / .35); --hair: rgb(255 255 255 / .14); --accent: #e67326; --accent-rgb: 230 115 38; --on-accent: #fff; --on-badge: #1a0d03; --danger: #ff453a; --online: #33d980; --shade: 0 0 0; --shade-k: 1;
    --muted: var(--text-2); --mine: var(--accent);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 14px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hair); }
  header h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, input, textarea { font: inherit; color: var(--text); }
  button { background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; min-height: 36px; padding: 0 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
  button.ghost { background: none; border: 0; color: var(--muted); padding: 0 6px; }
  button:disabled { opacity: .45; cursor: default; }
  .tabs { display: flex; gap: 6px; padding: 10px 14px 4px; }
  .tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  #list { list-style: none; margin: 0; padding: 0 0 120px; }
  .row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; background: none; border: 0; border-bottom: 1px solid var(--hair); border-radius: 0; text-align: left; min-height: 68px; }
  .av { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .who { min-width: 0; }
  .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who span { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { text-align: right; color: var(--muted); font-size: 12px; display: grid; gap: 4px; justify-items: end; }
  .badge { background: var(--accent); color: var(--on-badge); font-weight: 700; border-radius: 999px; min-width: 20px; padding: 0 6px; font-size: 12px; line-height: 20px; text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  #thread { display: flex; flex-direction: column; min-height: 100vh; }
  #bubbles { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 12px; }
  .b { max-width: 80%; padding: 8px 12px; border-radius: 18px; background: var(--s2); white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; }
  .b.mine { align-self: flex-end; background: var(--mine); color: var(--on-accent); }
  .b.failed { outline: 1px solid var(--danger); }
  .b time { display: block; font-size: 11px; opacity: .65; margin-top: 2px; }
  .day { align-self: center; color: var(--muted); font-size: 12px; margin: 8px 0 2px; }
  .compose { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px 104px; background: var(--bg); border-top: 1px solid var(--hair); }
  .compose textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; background: var(--s2); border: 1px solid var(--hair); border-radius: 20px; padding: 10px 14px; }
  #new { padding: 14px; display: grid; gap: 10px; }
  #new input { background: var(--s2); border: 1px solid var(--hair); border-radius: 12px; padding: 12px; }
  .note { color: var(--muted); font-size: 13px; padding: 6px 14px; }
  #q { display: block; width: calc(100% - 28px); margin: 6px 14px 4px; background: var(--s2); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; }
  .who span mark { background: none; color: var(--text); font-weight: 650; }
  .b img.photo { display: block; max-width: 100%; max-height: 360px; border-radius: 12px; margin: 4px 0; }
  .b video.video { display: block; max-width: 100%; max-height: 360px; border-radius: 12px; margin: 4px 0; background: #000; cursor: zoom-in; }
  .b button.photo { display: block; margin: 4px 0; background: rgb(0 0 0 / .25); border-color: transparent; color: inherit; }
  .b.pending { opacity: .7; }
  .b .again { display: flex; gap: 10px; margin-top: 4px; font-size: 12px; }
  .b .again button { min-height: 28px; padding: 0 10px; font-size: 12px; background: rgb(0 0 0 / .25); border-color: transparent; color: inherit; }
  #pick { padding: 0 12px; min-width: 44px; min-height: 42px; }
  #attach { position: relative; display: inline-block; margin: 0 12px; }
  #attach img { display: block; max-height: 96px; max-width: 160px; border-radius: 12px; }
  #attach button { position: absolute; top: -8px; right: -8px; min-height: 26px; min-width: 26px; padding: 0; background: var(--s1); }
  #thread.drop #bubbles { outline: 2px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
<section id="inbox">
  <header><h1>Messages</h1><button id="newBtn" class="primary">New</button></header>
  <div class="tabs" role="group" aria-label="Show"><button id="tInbox" aria-pressed="true">Inbox</button><button id="tReq" aria-pressed="false">Requests</button></div>
  <input id="q" type="search" placeholder="Search messages" aria-label="Search messages" autocomplete="off" hidden>
  <div class="note" id="status" role="status"></div>
  <ul id="list"></ul>
</section>
<section id="new" hidden aria-label="New message">
  <header style="margin:-14px -14px 0"><button class="ghost" id="newBack">‹ Back</button><h1>New message</h1></header>
  <label for="to">To: an npub or a hex public key</label>
  <input id="to" autocomplete="off" spellcheck="false" placeholder="npub1…">
  <div><button class="primary" id="go" disabled>Open the conversation</button></div>
</section>
<section id="thread" hidden aria-label="Conversation">
  <header><button class="ghost" id="back">‹ Back</button><div class="av" id="tav" style="width:32px;height:32px;font-size:14px"></div><h1 id="tname"></h1></header>
  <div class="note" id="older" hidden><button id="olderBtn">Older messages</button></div>
  <div id="bubbles" role="log" aria-live="polite"></div>
  <div class="note" id="tnote" role="status" hidden></div>
  <div id="attachRow" hidden><span id="attach"><img id="attachImg" alt="Photo to send"><video id="attachVid" muted playsinline preload="metadata" aria-label="Video to send" hidden></video><button type="button" id="unattach" aria-label="Remove photo">×</button></span></div>
  <div class="compose" id="form"><button type="button" id="pick" aria-label="Attach photo or video">Photo</button><input type="file" id="file" accept="image/*,video/*" hidden><textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea><button type="button" class="primary" id="send" disabled>Send</button></div>
</section>
<script>
/*@nv-theme*/
// The Messages napplet (plan P7): your direct messages through NAP-DM. This frame has no network and no key: the
// shell reads, decrypts and sends with its own DM stack (NIP-17 sealed and gift-wrapped there, NIP-42 AUTH there) and
// hands over only text. Inbox and Requests (strangers, as the classic page splits them), a conversation with older
// pages, live messages, and a new conversation from an npub. The shell opens one by intent (napplet:dm/open { pubkey }).

// ---- pure (test/napplet-messages.test.mjs loads this block) ----
const HEX = /^[0-9a-f]{64}$/
const B32 = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
/** "npub1…" or "nprofile1…" or 64 hex -> hex pubkey, else null. */
function pubkeyOf(input) {
  const s = String(input ?? "").trim().replace(/^nostr:/i, "").toLowerCase()
  if (HEX.test(s)) return s
  const p = s.lastIndexOf("1")
  if (p < 1 || !/^n(pub|profile)$/.test(s.slice(0, p))) return null
  const words = []
  for (const c of s.slice(p + 1, -6)) { const v = B32.indexOf(c); if (v < 0) return null; words.push(v) }
  let acc = 0, bits = 0; const bytes = []
  for (const w of words) { acc = (acc << 5) | w; bits += 5; while (bits >= 8) { bits -= 8; bytes.push((acc >> bits) & 255) } }
  let key = null
  if (s.startsWith("npub1")) key = bytes.length === 32 ? bytes : null
  else for (let i = 0; i + 2 <= bytes.length;) { const t = bytes[i], l = bytes[i + 1]; if (t === 0 && l === 32) { key = bytes.slice(i + 2, i + 34); break } i += 2 + l }
  const hex = key ? key.map(x => x.toString(16).padStart(2, "0")).join("") : ""
  return HEX.test(hex) ? hex : null
}
/** Merge a page or a live message into a thread: one per id, oldest first. */
function mergeThread(have, more) {
  const by = new Map(have.map(m => [m.id, m]))
  for (const m of more) if (m && typeof m.id === "string") by.set(m.id, m)
  return [...by.values()].sort((a, b) => a.createdAt - b.createdAt || (a.id < b.id ? -1 : 1))
}
function dayOf(ts, now = Date.now()) {
  const d = new Date(ts * 1000), t = new Date(now), start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime()
  const days = Math.round((start(t) - start(d)) / 86400000)
  return days === 0 ? "Today" : days === 1 ? "Yesterday" : d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: d.getFullYear() === t.getFullYear() ? undefined : "numeric" })
}
/** A message's lines as text and photos: a line that is just an https link to a picture is a photo (an old DM photo
 *  was sent as its link on its own line), and so is an encrypted kind 15 photo's link ("#nv-dm=", net/dm-file.js),
 *  which the shell decrypts when it fetches it. */
const PHOTO = /^https:\/\/[^\s]+\.(?:jpe?g|png|gif|webp|avif)(?:[?#][^\s]*)?$|^https:\/\/[^\s#]+#nv-dm=[A-Za-z0-9_-]+$/i
/** A locked link's type and size from its fragment ({ m, s }, net/dm-file.js fileLink), or null. */
function lockedOf(link) {
  const i = link.indexOf("#nv-dm=")
  if (i < 0) return null
  try {
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(link.slice(i + 7).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0))))
    return { mime: typeof d?.m === "string" ? d.m : "", size: Number.isSafeInteger(d?.s) && d.s > 0 ? d.s : 0 }
  } catch { return null }
}
/** A message's lines as text, photos and videos: a locked kind 15 file whose type is a video is a video. */
function partsOf(content) {
  const out = []
  for (const line of String(content ?? "").split("\n")) {
    const locked = PHOTO.test(line.trim()) ? lockedOf(line.trim()) : null
    if (locked && /^video\//i.test(locked.mime)) out.push({ video: line.trim(), ...(locked.size ? { size: locked.size } : {}) })
    else if (PHOTO.test(line.trim())) out.push({ photo: line.trim() })
    else if (out.length && out.at(-1).text !== undefined) out.at(-1).text += `\n${line}`
    else out.push({ text: line })
  }
  return out.filter(x => x.photo || x.video || x.text.trim())
}
/** The preview line: a photo's link reads as "Photo", a video's as "Video". */
const previewOf = content => partsOf(content).map(x => x.photo ? "Photo" : x.video ? "Video" : x.text.replace(/\s+/g, " ").trim()).join(" · ")
function ago(ts, now = Date.now() / 1000) { const s = Math.max(0, now - ts); return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d` }
// ---- end pure ----

const n = window.napplet || {}
const $ = id => document.getElementById(id)
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
let me = "", convs = [], showReq = false, open = null, msgs = [], cursor = null, sending = false
let query = "", found = null, photo = null, photoUrl = "", pending = null // pending: { to, text } a photo going out
const pics = new Map(), labels = new Map(), follows = new Map()
const nameOf = pk => labels.get(pk) || `${pk.slice(0, 10)}…`
const hue = pk => parseInt(pk.slice(0, 6), 16) % 360

function avatar(node, pk, url) {
  node.style.background = `hsl(${hue(pk)} 29% 48%)`; node.textContent = (Array.from(nameOf(pk))[0] || "?").toUpperCase()
  if (!url || !n.resource) return
  ;(pics.get(url) ?? (pics.set(url, n.resource.bytes(url).then(b => URL.createObjectURL(b)).catch(() => "")), pics.get(url)))
    .then(src => { if (!src) return; const i = el("img", node.className); i.alt = ""; i.src = src; i.style.cssText = node.style.cssText; i.id = node.id; node.replaceWith(i) })
}

async function loadList() {
  try {
    const page = await n.dm.conversations({ limit: 200 })
    convs = page.conversations
    for (const c of convs) learn(c)
    $("status").textContent = ""
  } catch (e) { $("status").textContent = `Can't read your messages here: ${e.message}` }
  if (query) await search(); else drawList()
}
function learn(c) { const p = c.participants[0]; if (!p) return; if (p.label) labels.set(p.pubkey, p.label); follows.set(p.pubkey, !!c.follows) }
// Search (the classic page's): names and message text, on this device; the shell searches what it has already opened.
let searchSeq = 0
async function search() {
  const q = query.trim(), seq = ++searchSeq
  if (!q) { found = null; drawList(); return }
  const page = await n.dm.conversations({ limit: 200, query: q }).catch(() => null)
  if (seq !== searchSeq) return
  found = page?.conversations ?? []
  drawList()
}
let searchTimer = 0
$("q").oninput = () => { query = $("q").value; clearTimeout(searchTimer); searchTimer = setTimeout(search, 150) }
// A brand-new conversation (no message yet) has no row to carry its name: ask the shell for this person's.
function askName(pk) {
  n.dm.conversations({ ids: [pk] }).then(page => {
    const c = page.conversations[0]; if (!c) return
    learn(c)
    if (open === pk) { $("tname").textContent = nameOf(pk); if (c.participants[0].avatar && $("tav").tagName !== "IMG") avatar($("tav"), pk, c.participants[0].avatar); drawThread(false) }
  }).catch(() => {})
}
function drawList() {
  const inbox = convs.filter(c => !c.request), req = convs.filter(c => c.request)
  const unreadReq = req.reduce((a, c) => a + c.unread, 0)
  $("tReq").textContent = req.length ? `Requests · ${req.length}${unreadReq ? ` (${unreadReq} new)` : ""}` : "Requests"
  const list = (found ?? convs).filter(c => !!c.request === showReq)
  $("q").hidden = !convs.length
  $("q").placeholder = showReq ? "Search requests" : "Search messages"
  const q = query.trim()
  $("list").replaceChildren(...(list.length ? list.map(c => {
    const pk = c.participants[0].pubkey, li = el("li"), b = el("button", "row"), av = el("div", "av"), who = el("div", "who"), meta = el("div", "meta")
    avatar(av, pk, c.participants[0].avatar)
    const shown = c.hit ?? c.last // a search hit shows the matching message instead of the last one
    who.append(el("b", "", nameOf(pk)), el("span", "", `${shown?.senderPubkey === me ? "You: " : ""}${previewOf(shown?.content ?? "")}`))
    meta.append(el("span", "", c.updatedAt ? ago(c.updatedAt) : "")); if (c.unread) meta.append(el("span", "badge", String(c.unread)))
    b.append(av, who, meta); b.onclick = () => openThread(pk, c.participants[0].avatar)
    li.append(b); return li
  }) : [el("li", "empty", q ? `Nothing in your ${showReq ? "requests" : "messages"} matches “${q}”.` : showReq ? "No requests. Messages from people you don't follow land here." : "No messages yet. Start one with New.")]))
}
// A search is for the list it was typed over (as on the classic page): switching lists clears it.
const clearSearch = () => { query = ""; found = null; $("q").value = ""; searchSeq++ }
$("tInbox").onclick = () => { showReq = false; clearSearch(); $("tInbox").setAttribute("aria-pressed", "true"); $("tReq").setAttribute("aria-pressed", "false"); drawList() }
$("tReq").onclick = () => { showReq = true; clearSearch(); $("tInbox").setAttribute("aria-pressed", "false"); $("tReq").setAttribute("aria-pressed", "true"); drawList() }

function show(which) { for (const s of ["inbox", "new", "thread"]) $(s).hidden = s !== which; scrollTo(0, which === "thread" ? document.body.scrollHeight : 0) }
async function openThread(pk, url) {
  open = pk; msgs = []; cursor = null
  $("tname").textContent = nameOf(pk); avatar($("tav"), pk, url || convs.find(c => c.id === pk)?.participants[0].avatar)
  $("bubbles").replaceChildren(el("div", "day", "Loading…")); $("text").value = ""; clearPhoto(); $("tnote").hidden = true; syncSend()
  show("thread")
  if (!labels.has(pk)) askName(pk)
  try { const page = await n.dm.messages({ conversationId: pk, limit: 50 }); msgs = mergeThread([], page.messages); cursor = page.cursor ?? null } catch (e) { msgs = []; $("bubbles").replaceChildren(el("div", "day", `Couldn't open it: ${e.message}`)); return }
  drawThread(true)
  loadList() // its unread count is gone now
}
function drawThread(toEnd) {
  $("older").hidden = !cursor
  const out = []; let day = ""
  for (const m of msgs) {
    const d = dayOf(m.createdAt); if (d !== day) { day = d; out.push(el("div", "day", d)) }
    const mine = m.senderPubkey === me
    const b = el("div", `b${mine ? " mine" : ""}${m.status === "failed" ? " failed" : ""}`)
    fill(b, m.content, mine || follows.get(open))
    b.append(el("time", "", m.status === "failed" ? (m.retrying ? "Sending again…" : "Not sent") : new Date(m.createdAt * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })))
    // The classic thread's "Not sent · Try again · Remove" (ConversationScreen.jsx).
    if (m.status === "failed" && mine && !m.retrying) {
      const row = el("div", "again"), go = el("button", "", "Try again"), rm = el("button", "", "Remove")
      go.type = rm.type = "button"; go.onclick = () => tryAgain(m); rm.onclick = () => tryAgain(m, true)
      row.append(go, rm); b.append(row)
    }
    out.push(b)
  }
  if (pending && pending.to === open) { const b = el("div", "b mine pending"); if (pending.text) b.append(pending.text); b.append(el("time", "", pending.video ? "Sending video…" : "Sending photo…")); out.push(b) }
  $("bubbles").replaceChildren(...(out.length ? out : [el("div", "day", "No messages yet. Say hello.")]))
  if (toEnd) scrollTo(0, document.body.scrollHeight)
}
/** A bubble's text and photos. Photos load through the shell (this frame has no network): at once from you or someone
 *  you follow, after a tap from anyone else, as the classic thread does (NoteText images). */
function fill(b, content, load) {
  for (const part of partsOf(content)) {
    if (part.text !== undefined) { b.append(part.text); continue }
    if (part.video) {
      // A locked video: its size first; a small one from someone you trust opens at once, any other after a tap.
      const size = part.size ? ` · ${mb(part.size)}` : ""
      if (load && part.size && part.size <= AUTO_VIDEO) b.append(videoOf(part.video, size, true))
      else { const t = el("button", "photo", `Video${size} · tap to load`); t.type = "button"; t.onclick = () => t.replaceWith(videoOf(part.video, size)); b.append(t) }
      continue
    }
    const url = part.photo
    if (load) b.append(photoOf(url))
    else { const t = el("button", "photo", "Photo · tap to load"); t.type = "button"; t.onclick = () => t.replaceWith(photoOf(url)); b.append(t) }
  }
}
const AUTO_VIDEO = 16 * 1024 * 1024 // the phones' and the classic thread's AUTO_SHOW_MAX
/** The link marked as opened without a tap ("a": 1, net/dm-file.js autoLink): the shell then reads at most AUTO_VIDEO,
 *  since the size tag is only the sender's word. */
function autoLink(link) {
  const i = link.indexOf("#nv-dm=")
  if (i < 0) return link
  try {
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(link.slice(i + 7).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0))))
    const b = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify({ ...d, a: 1 }))))
    return link.slice(0, i + 7) + b.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")
  } catch { return link }
}
const mb = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.ceil(n / 1024)} KB`
/** A locked video, opened by the shell (it fetches, checks and decrypts): silent in the bubble, a tap goes full screen. */
function videoOf(url, size, auto = false) {
  const wait = el("span", "", `Loading video${size}…`)
  if (!n.resource) return el("span", "", url)
  n.resource.bytes(auto ? autoLink(url) : url).then(blob => {
    const v = el("video", "video"); v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true; v.setAttribute("aria-label", "Video")
    v.src = URL.createObjectURL(blob)
    v.onclick = () => { v.controls = true; v.muted = false; if (v.requestFullscreen) v.requestFullscreen().catch(() => {}); else v.webkitEnterFullscreen?.(); v.play?.().catch(() => {}) }
    v.onfullscreenchange = () => { if (!document.fullscreenElement) { v.controls = false; v.muted = true } }
    wait.replaceWith(v)
  }, () => {
    // The shell may still be fetching a big one (a request here gives up after 30 s), or it was bigger than its size
    // said (an auto open stops there): a tap asks again, for the whole file.
    const again = el("button", "photo", "This video isn't here yet or couldn't load · tap to try again"); again.type = "button"
    again.onclick = () => again.replaceWith(videoOf(url, size))
    wait.replaceWith(again)
  })
  return wait
}
function photoOf(url) {
  const i = el("img", "photo"); i.alt = "Photo"; i.loading = "lazy"
  if (!n.resource) return el("span", "", url)
  ;(pics.get(url) ?? (pics.set(url, n.resource.bytes(url).then(x => URL.createObjectURL(x)).catch(() => "")), pics.get(url)))
    .then(src => { if (src) i.src = src; else i.replaceWith(el("span", "", "This photo couldn't load.")) })
  return i
}
$("olderBtn").onclick = async () => { const page = await n.dm.messages({ conversationId: open, cursor, limit: 50 }).catch(() => null); if (!page) return; msgs = mergeThread(msgs, page.messages); cursor = page.cursor ?? null; drawThread(false) }
$("back").onclick = () => { open = null; show("inbox"); loadList() }
const syncSend = () => { $("send").disabled = sending || (!$("text").value.trim() && !photo) }
// One photo per message (the classic thread's rule): picked, pasted or dropped. The shell redraws it without its
// metadata and uploads it when it's sent.
function setPhoto(f) {
  if (!f) return
  $("tnote").hidden = true
  const video = /^video\//.test(f.type ?? "")
  if (video ? f.size > 100 * 1024 * 1024 - 16 : (f.type && !/^image\//.test(f.type)) || f.size > 50 * 1024 * 1024) { $("tnote").textContent = video ? "That video is too big to send (at most 100 MB). Try a shorter clip." : "That isn't a photo this can send (one image, at most 50 MB)."; $("tnote").hidden = false; return }
  clearPhoto(); photo = f; photoUrl = URL.createObjectURL(f)
  $("attachImg").hidden = video; $("attachVid").hidden = !video
  if (video) $("attachVid").src = photoUrl; else $("attachImg").src = photoUrl
  $("attachRow").hidden = false; syncSend()
}
function clearPhoto() { if (photoUrl) URL.revokeObjectURL(photoUrl); photo = null; photoUrl = ""; $("attachRow").hidden = true; $("attachImg").removeAttribute("src"); $("attachVid").removeAttribute("src"); syncSend() }
$("pick").onclick = () => $("file").click()
$("file").onchange = () => { setPhoto($("file").files[0]); $("file").value = "" }
$("unattach").onclick = () => clearPhoto()
$("text").addEventListener("paste", e => { const f = [...(e.clipboardData?.files ?? [])].find(x => !x.type || /^(image|video)\//.test(x.type)); if (f) { e.preventDefault(); setPhoto(f) } })
$("thread").addEventListener("dragover", e => { if ([...(e.dataTransfer?.types ?? [])].includes("Files")) { e.preventDefault(); $("thread").classList.add("drop") } })
$("thread").addEventListener("dragleave", () => $("thread").classList.remove("drop"))
$("thread").addEventListener("drop", e => { $("thread").classList.remove("drop"); const f = [...(e.dataTransfer?.files ?? [])].find(x => !x.type || /^(image|video)\//.test(x.type)); if (f) { e.preventDefault(); setPhoto(f) } })
$("text").oninput = () => { syncSend(); $("text").style.height = "auto"; $("text").style.height = `${Math.min(160, $("text").scrollHeight)}px` }
// No <form>: the frame's sandbox has no allow-forms, so a submit never reaches its handler.
$("text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendNow() } }
$("send").onclick = () => sendNow()
/** Try again (or Remove) a message that wasn't sent. The shell keeps its own failed messages with their resend (a photo
 *  that never uploaded uploads again); one it never kept (the send was refused before it began) comes back to the box. */
async function tryAgain(m, discard = false) {
  const to = open
  if (!m.id || /^(failed|refused):/.test(m.id)) {
    msgs = msgs.filter(x => x !== m); drawThread(false)
    if (!discard && !$("text").value.trim()) { $("text").value = String(m.content ?? "").replace(/\n?\((?:photo|video)\)$/, ""); syncSend(); $("text").focus() }
    return
  }
  m.retrying = !discard; drawThread(false)
  const r = await n.dm.send({ recipients: [to], conversationId: to, content: "", retry: m.id, ...(discard ? { discard: true } : {}) }).catch(e => ({ ok: false, error: e.message, message: null }))
  if (open !== to) return
  msgs = msgs.filter(x => x.id !== m.id)
  if (r.message && !r.message.removed) msgs = mergeThread(msgs, [r.message])
  $("tnote").hidden = r.ok !== false; if (r.ok === false) $("tnote").textContent = r.message?.error || r.error || "Not sent. Try again later."
  drawThread(!discard)
}
async function sendNow() {
  const text = $("text").value.trim(), ph = photo; if ((!text && !ph) || sending || !open) return
  sending = true; syncSend()
  const to = open
  // A photo uploads first: its bubble shows at once ("Sending photo…") and the box clears, as on the classic thread.
  if (ph) { pending = { to, text, video: /^video\//.test(ph.type ?? "") }; $("text").value = ""; photo = null; $("attachRow").hidden = true; drawThread(true) }
  let ok = false, kept = false // kept: the shell holds the failed message, so its bubble has Try again
  try {
    const r = await n.dm.send({ recipients: [to], conversationId: to, content: text, ...(ph ? { photo: ph } : {}) })
    ok = r.ok; kept = !r.ok && !!r.message?.id && !/^(failed|refused):/.test(r.message.id)
    pending = null
    if (open === to) { msgs = mergeThread(msgs, [r.message]); drawThread(true) }
    if ((r.ok || kept) && !ph) $("text").value = ""
    if (!r.ok && r.message?.error && open === to) { $("tnote").textContent = r.message.error; $("tnote").hidden = false }
  } catch (err) { pending = null; if (open === to) { msgs = mergeThread(msgs, [{ id: `failed:${Date.now()}`, conversationId: to, senderPubkey: me, createdAt: Math.floor(Date.now() / 1000), content: ph ? `${text ? `${text}\n` : ""}(${/^video\//.test(ph.type ?? "") ? "video" : "photo"})` : text, status: "failed" }]); drawThread(true) } }
  // Not sent and not kept by the shell: the photo and its words come back to the box, ready to try again.
  if (ph) { if (!ok && !kept && open === to && !photo) { setPhoto(ph); if (!$("text").value) $("text").value = text } else if (photoUrl && !photo) clearPhoto() }
  sending = false; syncSend()
}
$("newBtn").onclick = () => { $("to").value = ""; $("go").disabled = true; show("new"); $("to").focus() }
$("newBack").onclick = () => show("inbox")
$("to").oninput = () => { $("go").disabled = !pubkeyOf($("to").value) }
$("go").onclick = () => { const pk = pubkeyOf($("to").value); if (pk) openThread(pk) }

;(async () => {
  nvTheme(n)
  n.intent?.onDelivery?.(d => {
    if (d?.archetype !== "dm") return
    if (d.action === "refresh") { loadList().then(() => { if (!open) return; $("tname").textContent = nameOf(open); if (!labels.has(open)) askName(open) }); return }
    const pk = d?.payload?.pubkey; if (HEX.test(pk ?? "")) openThread(pk)
  })
  if (!n.dm) { $("status").textContent = "This shell doesn't offer direct messages."; return }
  const st = await n.dm.status().catch(() => null)
  if (!st?.available) { $("status").textContent = "Your direct messages aren't shared with this napplet."; return }
  me = st.ownerPubkey
  $("status").textContent = "Opening your messages…"
  n.dm.onMessage(m => {
    if (open && m.conversationId === open) { msgs = mergeThread(msgs, [m]); drawThread(true) }
    clearTimeout(window.__lt); window.__lt = setTimeout(loadList, 300)
  })
  await n.dm.subscribe({}).catch(() => {})
  loadList()
})()
</script>
