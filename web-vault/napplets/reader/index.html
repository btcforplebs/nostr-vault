<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
  :root { color-scheme: dark; --bg: #000; --s1: #1c1c1e; --s2: #2c2c2e; --s3: #3a3a3c; --text: #fff; --text-2: rgb(255 255 255 / .60); --text-3: rgb(255 255 255 / .35); --hair: rgb(255 255 255 / .14); --accent: #e67326; --accent-rgb: 230 115 38; --on-accent: #fff; --on-badge: #1a0d03; --danger: #ff453a; --online: #33d980; --shade: 0 0 0; --shade-k: 1;
    --muted: var(--text-2);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hair); }
  header h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; min-height: 36px; padding: 0 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
  button.ghost { background: none; border: 0; color: var(--muted); padding: 0 8px; }
  button.ghost.on { color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #pick { padding: 0 6px; font-size: 15px; margin-right: auto; }
  #pick:not([hidden]) ~ #new { margin-left: 0; }
  header:has(#pick:not([hidden])) h1 { flex: 0 1 auto; cursor: pointer; }
  #picker { position: sticky; top: 52px; z-index: 3; display: grid; gap: 2px; padding: 6px; margin: 0 10px; border: 1px solid var(--hair); border-radius: 14px;
    background: var(--s1); box-shadow: 0 10px 30px rgb(var(--shade) / calc(.66 * var(--shade-k))); }
  #picker button { text-align: left; border: 0; background: none; border-radius: 10px; }
  #picker button.on { color: var(--accent); background: var(--s2); }
  #picker form { display: flex; gap: 6px; padding: 4px 2px 2px; }
  #picker input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; padding: 0 12px; min-height: 36px; }
  #fresh { position: sticky; top: 60px; z-index: 3; display: block; margin: 8px auto 0; }
  #fresh[hidden], [hidden] { display: none !important; }
  #list { list-style: none; margin: 0; padding: 0; }
  article { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  article.focus { background: var(--s1); cursor: default; }
  article.kbd { box-shadow: inset 3px 0 0 var(--accent); background: var(--s1); }
  article.open { background: var(--s2); box-shadow: inset 3px 0 0 var(--accent); }
  /* Beside the list (plan step 2): the shell's bar names the thread and closes it; only ‹ Back stays here, when needed. */
  body.side #title, body.side #new { display: none; }
  body.side header:has(#back[hidden]) { display: none; }
  .av { width: 44px; height: 44px; border-radius: 50%; background: var(--s2); object-fit: cover; display: grid; place-items: center; color: var(--muted); font-weight: 700; border: 0; padding: 0; }
  .who { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .who span { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0 6px; }
  .body code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--s2); border-radius: 4px; padding: 1px 4px; }
  .body a, .body .tag { color: var(--accent); text-decoration: none; cursor: pointer; }
  .media { display: grid; gap: 6px; margin: 6px 0; }
  .media img.zoom { cursor: zoom-in; }
  .media img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; background: var(--s2); min-height: 80px; }
  .media .vid { padding: 0 14px; min-height: 56px; border-radius: 12px; background: var(--s2); color: var(--text); font-size: 14px; text-align: left; }
  .media video { width: 100%; max-height: 420px; border-radius: 12px; background: #000; }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--s2); border: 1px solid var(--hair);
    color: var(--text); text-decoration: none; font-size: 13px; cursor: pointer; min-width: 0; }
  .card .glyph { color: var(--accent); flex: none; }
  .card .host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.rich { align-items: flex-start; }
  .card.rich img { flex: none; width: 72px; height: 72px; min-height: 0; border-radius: 6px; object-fit: cover; background: var(--s1); }
  .card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card .site, .card .dom { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ttl, .card .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .card .ttl { font-weight: 600; }
  .card .desc { color: var(--muted); font-size: 12px; }
  .kind { margin: 2px 0 6px; display: grid; gap: 6px; }
  .kmeta { color: var(--muted); font-size: 12px; }
  .art-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; background: var(--s2); }
  .art-title { margin: 0; font-size: 17px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .art-prev { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hl-comment { margin: 0; white-space: pre-wrap; }
  .hl-passage { margin: 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--accent); font-family: Georgia, "Times New Roman", serif; font-size: 16px;
    white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .poll-q { margin: 0; font-weight: 600; white-space: pre-wrap; }
  .poll-opts { display: grid; gap: 6px; }
  .poll-opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; border-radius: 10px; min-height: 40px; text-align: left; }
  .poll-opt.on { border-color: var(--accent); }
  .poll-opt:disabled { opacity: 1; }
  .poll-bar { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 22%, transparent); pointer-events: none; }
  .poll-mark, .poll-label, .poll-pct { position: relative; }
  .poll-label { flex: 1; }
  .poll-pct { color: var(--muted); font-size: 13px; }
  .poll-vote { justify-self: start; }
  .poll-err { margin: 0; color: var(--danger); font-size: 13px; }
  .acts { position: relative; }
  .tapback { position: absolute; bottom: 100%; left: 40px; z-index: 4; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--s2); border: 1px solid var(--hair); box-shadow: 0 6px 20px rgb(var(--shade) / calc(.5 * var(--shade-k))); }
  .tapback button { border: 0; background: none; font-size: 22px; min-height: 40px; padding: 0 6px; }
  .outside { margin: 0; color: var(--muted); font-size: 13px; }
  .quote { border: 1px solid var(--hair); border-radius: 12px; padding: 8px 10px; margin: 6px 0; color: var(--muted); font-size: 14px; }
  .acts { display: flex; gap: 2px; margin-left: -8px; flex-wrap: wrap; }
  .quote { cursor: pointer; display: grid; gap: 2px; }
  .quote b { color: var(--text); font-size: 13px; }
  .rp { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  .reply-line { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .indent { padding-left: 30px; }
  .prof { padding: 14px; border-bottom: 1px solid var(--hair); }
  .prof .top { display: flex; gap: 12px; align-items: center; }
  .prof .av { width: 64px; height: 64px; font-size: 22px; }
  .prof h2 { margin: 0; font-size: 19px; }
  .prof p { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); margin: 10px 0 0; }
  .muted { color: var(--muted); font-size: 13px; }
  #sbar { position: sticky; top: 52px; z-index: 2; display: grid; gap: 8px; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--hair); }
  #sbar .srow { display: flex; gap: 8px; align-items: center; }
  #sbar input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; padding: 0 14px; min-height: 38px; }
  #sbar .stabs { display: flex; gap: 2px; } #sbar .stabs button { border: 0; background: none; color: var(--muted); min-height: 32px; padding: 0 12px; }
  #sbar .stabs button.on { background: var(--s2); color: var(--text); font-weight: 650; }
  #sbar .fbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .fmenu { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--hair); border-radius: 12px; background: var(--s1); }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 10px; }
  .chiprow button { min-height: 30px; font-size: 13px; padding: 0 12px; }
  .chiprow button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .slabel { margin: 0; padding: 12px 14px 4px; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .slabel button { min-height: 26px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  .person { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 8px 14px; border: 0; border-radius: 0; background: none; text-align: left; min-height: 56px; }
  .person:hover { background: var(--s1); } .person .av { width: 40px; height: 40px; }
  .person b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .person span.sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; }
  .src { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--s2); color: var(--muted); } .src.hit { color: var(--text); } .src.failed { color: var(--danger); }
  .vmodes { display: flex; gap: 2px; overflow-x: auto; padding: 8px 10px; border-bottom: 1px solid var(--hair); }
  .vmodes button { border: 0; background: none; color: var(--muted); min-height: 32px; padding: 0 10px; white-space: nowrap; position: relative; }
  .vmodes button.on { background: var(--s2); color: var(--text); font-weight: 650; }
  .vmodes button .dot { position: absolute; top: 5px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .vtools { display: flex; gap: 8px; align-items: center; padding: 8px 14px 0; flex-wrap: wrap; }
  .vtools .grow { flex: 1; }
  .engage { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--hair); }
  .engage.tap { cursor: pointer; } .engage.tap:hover { background: var(--s1); }
  .engage .av { width: 32px; height: 32px; font-size: 12px; } .engage time { color: var(--muted); font-size: 12px; }
  .notif { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--hair); }
  .notif.tap { cursor: pointer; } .notif.tap:hover { background: var(--s1); }
  .notif .badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); color: var(--accent); font-size: 14px; }
  .notif.unread .badge { background: color-mix(in srgb, var(--accent) 22%, var(--s2)); }
  .ntop { display: flex; align-items: center; gap: 4px; }
  .ntop .av { width: 26px; height: 26px; font-size: 11px; }
  .ntop time { margin-left: auto; color: var(--muted); font-size: 12px; }
  .ndot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: 6px; }
  .nwho { margin: 6px 0 2px; } .nwho b { font-weight: 650; }
  .nwords { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .nabout { color: var(--muted); font-size: 14px; border-left: 2px solid var(--hair); padding-left: 10px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nthumbs { display: flex; gap: 6px; margin-top: 6px; } .nthumbs img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--s2); }
  .fold { display: block; margin: 8px 14px; }
  .sect { margin: 0; padding: 14px 14px 2px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .sect-note { margin: 0; padding: 0 14px 10px; border-bottom: 1px solid var(--hair); }
  /* Your own profile (plan step 5): the site's ProfileHeader, drawn here. */
  .mine { border-bottom: 1px solid var(--hair); padding-bottom: 12px; }
  .mine .banner { height: 150px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 45%, var(--s2)), var(--s1)); overflow: hidden; }
  .mine .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mine .id { display: flex; gap: 12px; align-items: flex-end; padding: 0 14px; margin-top: -36px; }
  .mine .id .av { width: 76px; height: 76px; font-size: 26px; border: 3px solid var(--bg); }
  .mine h2 { margin: 0; font-size: 21px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .you { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 6px; border-radius: 999px; background: var(--accent); color: var(--on-badge); }
  .mine .about { margin: 10px 14px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 14px 0; }
  .chips button { min-height: 30px; font-size: 13px; padding: 0 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts { display: flex; gap: 16px; margin: 10px 14px 0; color: var(--muted); font-size: 14px; }
  .counts b { color: var(--text); }
  .mine .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 14px 0; }
  .tabs { position: sticky; top: 52px; z-index: 1; display: flex; gap: 2px; overflow-x: auto; padding: 8px 10px; background: var(--bg); border-bottom: 1px solid var(--hair); }
  .tabs button { border: 0; background: none; color: var(--muted); min-height: 32px; padding: 0 12px; white-space: nowrap; }
  .tabs button.on { background: var(--s2); color: var(--text); font-weight: 650; }
  .shop { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .shop img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--s2); }
  .shop b { display: block; } .shop .price { color: var(--accent); font-weight: 650; font-size: 13px; }
  .empty, .more { text-align: center; padding: 22px 14px; color: var(--muted); }
  /* Room under the last note: the app's tab bar floats over the bottom of this frame on a phone. */
  #foot { padding-bottom: 120px; }
</style>
</head>
<body>
<header><button id="back" class="ghost" hidden aria-label="Back">‹ Back</button><h1 id="title">Following</h1><button id="pick" class="ghost" aria-haspopup="menu" aria-expanded="false" aria-label="Choose a feed">▾</button><button id="new" class="primary">Post</button></header>
<div id="picker" role="menu" hidden></div>
<div id="sbar" hidden></div>
<button id="fresh" class="primary" hidden></button>
<main id="list" role="feed" aria-busy="true"></main>
<div id="foot" class="more"></div>
<script>
/*@nv-theme*/
// The Reader napplet (plan P4): Feed, Thread and Profile in one frame. It has no network and no key: every note comes
// from the shell (outbox: the vault first, then relays, block-filtered), pictures come as bytes from the shell, and a
// reaction is signed by the shell. Reply and Post hand off to the Compose napplet by intent (napplet:compose/reply,
// napplet:compose/new); a link opens through the shell (napplet:link/open). The shell opens a thread or profile here
// by intent too (napplet:note/open, napplet:profile/open), from #/thread/<id> and #/profile/<pubkey>.

// ---- pure (test/napplet-reader.test.mjs loads this block) ----
const HEX = /^[0-9a-f]{64}$/
const B32 = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
function bech32Bytes(str) {
  const s = String(str).toLowerCase(), p = s.lastIndexOf("1")
  if (p < 1 || s.length - p < 7) return null
  const words = []
  for (const c of s.slice(p + 1, -6)) { const v = B32.indexOf(c); if (v < 0) return null; words.push(v) }
  let acc = 0, bits = 0; const out = []
  for (const w of words) { acc = (acc << 5) | w; bits += 5; while (bits >= 8) { bits -= 8; out.push((acc >> bits) & 255) } }
  return { prefix: s.slice(0, p), bytes: out }
}
const hexOf = b => b.map(x => x.toString(16).padStart(2, "0")).join("")
/** nostr:npub/nprofile/note/nevent -> { type: "profile", pubkey } | { type: "note", id } | null (TLV type 0 = the key). */
function decodeNostr(ref) {
  const d = bech32Bytes(ref)
  if (!d) return null
  let key = null
  if (d.prefix === "npub" || d.prefix === "note") key = d.bytes.length === 32 ? hexOf(d.bytes) : null
  else if (d.prefix === "nprofile" || d.prefix === "nevent") {
    for (let i = 0; i + 2 <= d.bytes.length;) { const t = d.bytes[i], l = d.bytes[i + 1]; if (t === 0 && l === 32) { key = hexOf(d.bytes.slice(i + 2, i + 34)); break } i += 2 + l }
  } else return null
  if (!key || !HEX.test(key)) return null
  return d.prefix === "npub" || d.prefix === "nprofile" ? { type: "profile", pubkey: key } : { type: "note", id: key }
}
const TOKEN = /(https?:\/\/[^\s<>"]+|nostr:(?:npub|nprofile|note|nevent)1[02-9ac-hj-np-z]+|(?<![\p{L}\p{N}_])#[\p{L}\p{N}_]+)/gu
const IMG = /\.(jpe?g|png|gif|webp|avif)(\?[^\s]*)?$/i, VID = /\.(mp4|mov|webm|m4v|m3u8)(\?[^\s]*)?$/i
/** A note's text -> parts: text, link, image, video, profile, note, tag. Trailing punctuation stays text. */
function tokenize(content) {
  const out = [], s = String(content ?? "")
  let at = 0
  for (const m of s.matchAll(TOKEN)) {
    let tok = m[0], tail = ""
    if (tok.startsWith("http")) { const t = /[.,;:!?)\]]+$/.exec(tok); if (t) { tail = t[0]; tok = tok.slice(0, -tail.length) } }
    if (m.index > at) out.push({ t: "text", v: s.slice(at, m.index) })
    if (tok.startsWith("http")) out.push({ t: IMG.test(tok) ? "image" : VID.test(tok) ? "video" : "link", v: tok })
    else if (tok.startsWith("#")) out.push(/\p{L}/u.test(tok) && [...tok].length <= 65 ? { t: "tag", v: tok.slice(1) } : { t: "text", v: tok })
    else { const d = decodeNostr(tok.slice(6)); out.push(d ? { t: d.type, v: d.type === "note" ? d.id : d.pubkey } : { t: "text", v: tok }) }
    if (tail) out.push({ t: "text", v: tail })
    at = m.index + m[0].length
  }
  if (at < s.length) out.push({ t: "text", v: s.slice(at) })
  return out.reduce((a, p) => (p.t === "text" && a.length && a[a.length - 1].t === "text" ? (a[a.length - 1].v += p.v, a) : (a.push(p), a)), [])
}
/** A note's links that become cards under the text (not pictures, not video, not .fips), at most 3, as the classic
 *  feed's cardLinks; they leave the text. */
function cardLinks(parts) {
  const out = []
  for (const p of parts) if (p.t === "link" && !/^https?:\/\/[^/?#]*\.fips(:\d+)?([/?#]|$)/i.test(p.v) && !out.includes(p.v)) out.push(p.v)
  return out.slice(0, 3)
}
/** The parts with the carded links taken out, the text either side joined, the ends trimmed (classic withoutLinks). */
function withoutCards(parts, cards) {
  if (!cards.length) return parts
  const out = []
  for (const p of parts) {
    if (p.t === "link" && cards.includes(p.v)) continue
    if (p.t === "text" && out.length && out[out.length - 1].t === "text") out[out.length - 1] = { t: "text", v: out[out.length - 1].v + p.v }
    else out.push(p)
  }
  if (out[0]?.t === "text") out[0] = { t: "text", v: out[0].v.replace(/^\s+/, "") }
  const z = out.length - 1
  if (out[z]?.t === "text") out[z] = { t: "text", v: out[z].v.replace(/\s+$/, "") }
  return out.filter(p => p.t !== "text" || p.v)
}
const hostOf = url => { try { return new URL(url).hostname.replace(/^www\./, "") } catch { return url } }
// Inline marks, as the classic note text (src/net/inline-md.js, the same expression; a test keeps them equal):
// **bold** / __bold__, *italic* / _italic_, ~~strike~~ and `code`.
const MARKS = /(\*\*|__)(?=\S)(.+?)(?<=\S)\1|~~(?=\S)(.+?)(?<=\S)~~|`([^`\n]+)`|(?<![\w*_])([*_])(?=[^\s*_])(.+?)(?<=[^\s*_])\5(?![\w*_])/g
/** [{ type: "text" | "strong" | "em" | "del" | "code", text }] */
function inlineMarks(text) {
  const out = []
  let at = 0

async function start() {
  nvTheme(n)
  me = await n.identity.getPublicKey().catch(() => "")
  // The shell opens a note or a profile here by intent; a reply this account just posted lands in the thread at once.
  n.intent?.onDelivery?.(d => {
    const p = d?.payload ?? {}
    if (d.archetype === "note" && d.action !== "removed" && HEX.test(p.id ?? "")) { if (p.side === true) { document.body.classList.add("side"); stack = []; return go({ kind: "thread", id: p.id }, false) } go({ kind: "thread", id: p.id }, view.kind !== "feed" || stack.length > 0) }
    else if (d.archetype === "profile" && HEX.test(p.pubkey ?? "")) go({ kind: "profile", pubkey: p.pubkey }, view.kind !== "feed" || stack.length > 0)
    else if (d.archetype === "feed" && p.list === "vault") { stack = []; go({ kind: "vault" }, false) }
    else if (d.archetype === "feed" && p.list === "search") { stack = []; go({ kind: "search" }, false) }
    else if (d.archetype === "feed" && p.list === "notifications") { stack = []; go({ kind: "notifications" }, false) }
    else if (d.archetype === "feed" && p.list === "bookmarks") { stack = []; go({ kind: "bookmarks" }, false) }
    else if (d.archetype === "feed" && typeof p.tag === "string" && /^[\p{L}\p{N}_]{1,64}$/u.test(p.tag)) go({ kind: "tag", tag: p.tag.toLowerCase() })
    else if (d.archetype === "feed") { stack = []; go({ kind: "feed" }, false) }
    else if (d.archetype === "note" && d.action === "removed" && HEX.test(p.id ?? "")) {
      // Deleted from the ⋯ menu: gone from the feed at once, and from a thread or profile on screen.
      notes = notes.filter(x => x.id !== p.id && (repostOf(x)?.id !== p.id))
      for (const [k, f] of feeds) feeds.set(k, { ...f, notes: f.notes.filter(x => x.id !== p.id && (repostOf(x)?.id !== p.id)) })
      for (const a of document.querySelectorAll(`article[data-id="${p.id}"]`)) a.remove()
      if (view.kind === "feed") drawFeed()
    }
  })
  n.inc?.on?.("nv.note.stats", e => showStats(e?.payload))
  n.inc?.on?.("nv.key.cmd", e => rowCmd(e?.payload?.cmd))
  n.inc?.on?.("nv.note.open", e => markOpen(e?.payload?.id))
  // Your profile saved, or its follower count came in: the header again, the tab as it was.
  n.inc?.on?.("nv.vault.changed", () => { if (view.kind === "vault") showVault(true) })
  n.inc?.on?.("nv.search.changed", () => { if (view.kind === "search") showSearch(true) })
  n.inc?.on?.("nv.notifications.changed", () => { if (view.kind === "notifications") showNotifs(true) })
  n.inc?.on?.("nv.bookmarks.changed", () => { if (view.kind === "bookmarks") showBookmarks() })
  n.inc?.on?.("nv.profile.changed", () => { if (view.kind === "profile" && view.pubkey === me) mineHeadNow().then(drawMine) })
  n.inc?.on?.("nv.compose.sent", e => {
    const ev = e?.payload?.event
    if (!ev || !HEX.test(ev.id ?? "")) return
    if (view.kind === "feed" && feedKeeps(mode, ev)) { notes = mergeNotes([ev], notes); keep(); drawFeed() }
    else if (view.kind === "thread") showThread(view.id, view.event)
  })
  render()
}
start()
</script>
</body>
</html>
