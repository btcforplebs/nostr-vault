<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
  :root { color-scheme: dark; --bg: #000; --text: #f2f2f2; --muted: #9a9a9f; --hair: #26262a; --s1: #111113; --s2: #1c1c1f; --accent: #e67326;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hair); }
  header h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; min-height: 36px; padding: 0 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 650; }
  button.ghost { background: none; border: 0; color: var(--muted); padding: 0 8px; }
  button.ghost.on { color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #fresh { position: sticky; top: 60px; z-index: 3; display: block; margin: 8px auto 0; }
  #fresh[hidden], [hidden] { display: none !important; }
  #list { list-style: none; margin: 0; padding: 0; }
  article { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  article.focus { background: var(--s1); cursor: default; }
  .av { width: 44px; height: 44px; border-radius: 50%; background: var(--s2); object-fit: cover; display: grid; place-items: center; color: var(--muted); font-weight: 700; border: 0; padding: 0; }
  .who { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .who span { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0 6px; }
  .body code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--s2); border-radius: 4px; padding: 1px 4px; }
  .body a, .body .tag { color: var(--accent); text-decoration: none; cursor: pointer; }
  .media { display: grid; gap: 6px; margin: 6px 0; }
  .media img.zoom { cursor: zoom-in; }
  .media img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; background: var(--s2); min-height: 80px; }
  .media .vid { padding: 0 14px; min-height: 56px; border-radius: 12px; background: var(--s2); color: var(--text); font-size: 14px; text-align: left; }
  .media video { width: 100%; max-height: 420px; border-radius: 12px; background: #000; }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--s2); border: 1px solid var(--hair);
    color: var(--text); text-decoration: none; font-size: 13px; cursor: pointer; min-width: 0; }
  .card .glyph { color: var(--accent); flex: none; }
  .card .host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.rich { align-items: flex-start; }
  .card.rich img { flex: none; width: 72px; height: 72px; min-height: 0; border-radius: 6px; object-fit: cover; background: var(--s1); }
  .card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card .site, .card .dom { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ttl, .card .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .card .ttl { font-weight: 600; }
  .card .desc { color: var(--muted); font-size: 12px; }
  .kind { margin: 2px 0 6px; display: grid; gap: 6px; }
  .kmeta { color: var(--muted); font-size: 12px; }
  .art-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; background: var(--s2); }
  .art-title { margin: 0; font-size: 17px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .art-prev { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hl-comment { margin: 0; white-space: pre-wrap; }
  .hl-passage { margin: 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--accent); font-family: Georgia, "Times New Roman", serif; font-size: 16px;
    white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .poll-q { margin: 0; font-weight: 600; white-space: pre-wrap; }
  .poll-opts { display: grid; gap: 6px; }
  .poll-opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; border-radius: 10px; min-height: 40px; text-align: left; }
  .poll-opt.on { border-color: var(--accent); }
  .poll-opt:disabled { opacity: 1; }
  .poll-bar { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 22%, transparent); pointer-events: none; }
  .poll-mark, .poll-label, .poll-pct { position: relative; }
  .poll-label { flex: 1; }
  .poll-pct { color: var(--muted); font-size: 13px; }
  .poll-vote { justify-self: start; }
  .poll-err { margin: 0; color: #ff6b6b; font-size: 13px; }
  .acts { position: relative; }
  .tapback { position: absolute; bottom: 100%; left: 40px; z-index: 4; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--s2); border: 1px solid var(--hair); box-shadow: 0 6px 20px #0008; }
  .tapback button { border: 0; background: none; font-size: 22px; min-height: 40px; padding: 0 6px; }
  .quote { border: 1px solid var(--hair); border-radius: 12px; padding: 8px 10px; margin: 6px 0; color: var(--muted); font-size: 14px; }
  .acts { display: flex; gap: 2px; margin-left: -8px; flex-wrap: wrap; }
  .quote { cursor: pointer; display: grid; gap: 2px; }
  .quote b { color: var(--text); font-size: 13px; }
  .rp { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  .reply-line { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .indent { padding-left: 30px; }
  .prof { padding: 14px; border-bottom: 1px solid var(--hair); }
  .prof .top { display: flex; gap: 12px; align-items: center; }
  .prof .av { width: 64px; height: 64px; font-size: 22px; }
  .prof h2 { margin: 0; font-size: 19px; }
  .prof p { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); margin: 10px 0 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty, .more { text-align: center; padding: 22px 14px; color: var(--muted); }
  /* Room under the last note: the app's tab bar floats over the bottom of this frame on a phone. */
  #foot { padding-bottom: 120px; }
</style>
</head>
<body>
<header><button id="back" class="ghost" hidden aria-label="Back">‹ Back</button><h1 id="title">Following</h1><button id="new" class="primary">Post</button></header>
<button id="fresh" class="primary" hidden></button>
<main id="list" role="feed" aria-busy="true"></main>
<div id="foot" class="more"></div>
<script>
// The Reader napplet (plan P4): Feed, Thread and Profile in one frame. It has no network and no key: every note comes
// from the shell (outbox: the vault first, then relays, block-filtered), pictures come as bytes from the shell, and a
// reaction is signed by the shell. Reply and Post hand off to the Compose napplet by intent (napplet:compose/reply,
// napplet:compose/new); a link opens through the shell (napplet:link/open). The shell opens a thread or profile here
// by intent too (napplet:note/open, napplet:profile/open), from #/thread/<id> and #/profile/<pubkey>.

// ---- pure (test/napplet-reader.test.mjs loads this block) ----
const HEX = /^[0-9a-f]{64}$/
const B32 = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
function bech32Bytes(str) {
  const s = String(str).toLowerCase(), p = s.lastIndexOf("1")
  if (p < 1 || s.length - p < 7) return null
  const words = []
  for (const c of s.slice(p + 1, -6)) { const v = B32.indexOf(c); if (v < 0) return null; words.push(v) }
  let acc = 0, bits = 0; const out = []
  for (const w of words) { acc = (acc << 5) | w; bits += 5; while (bits >= 8) { bits -= 8; out.push((acc >> bits) & 255) } }
  return { prefix: s.slice(0, p), bytes: out }
}
const hexOf = b => b.map(x => x.toString(16).padStart(2, "0")).join("")
/** nostr:npub/nprofile/note/nevent -> { type: "profile", pubkey } | { type: "note", id } | null (TLV type 0 = the key). */
function decodeNostr(ref) {
  const d = bech32Bytes(ref)
  if (!d) return null
  let key = null
  if (d.prefix === "npub" || d.prefix === "note") key = d.bytes.length === 32 ? hexOf(d.bytes) : null
  else if (d.prefix === "nprofile" || d.prefix === "nevent") {
    for (let i = 0; i + 2 <= d.bytes.length;) { const t = d.bytes[i], l = d.bytes[i + 1]; if (t === 0 && l === 32) { key = hexOf(d.bytes.slice(i + 2, i + 34)); break } i += 2 + l }
  } else return null
  if (!key || !HEX.test(key)) return null
  return d.prefix === "npub" || d.prefix === "nprofile" ? { type: "profile", pubkey: key } : { type: "note", id: key }
}
const TOKEN = /(https?:\/\/[^\s<>"]+|nostr:(?:npub|nprofile|note|nevent)1[02-9ac-hj-np-z]+|(?<![\p{L}\p{N}_])#[\p{L}\p{N}_]+)/gu
const IMG = /\.(jpe?g|png|gif|webp|avif)(\?[^\s]*)?$/i, VID = /\.(mp4|mov|webm|m4v|m3u8)(\?[^\s]*)?$/i
/** A note's text -> parts: text, link, image, video, profile, note, tag. Trailing punctuation stays text. */
function tokenize(content) {
  const out = [], s = String(content ?? "")
  let at = 0
  for (const m of s.matchAll(TOKEN)) {
    let tok = m[0], tail = ""
    if (tok.startsWith("http")) { const t = /[.,;:!?)\]]+$/.exec(tok); if (t) { tail = t[0]; tok = tok.slice(0, -tail.length) } }
    if (m.index > at) out.push({ t: "text", v: s.slice(at, m.index) })
    if (tok.startsWith("http")) out.push({ t: IMG.test(tok) ? "image" : VID.test(tok) ? "video" : "link", v: tok })
    else if (tok.startsWith("#")) out.push(/\p{L}/u.test(tok) && [...tok].length <= 65 ? { t: "tag", v: tok.slice(1) } : { t: "text", v: tok })
    else { const d = decodeNostr(tok.slice(6)); out.push(d ? { t: d.type, v: d.type === "note" ? d.id : d.pubkey } : { t: "text", v: tok }) }
    if (tail) out.push({ t: "text", v: tail })
    at = m.index + m[0].length
  }
  if (at < s.length) out.push({ t: "text", v: s.slice(at) })
  return out.reduce((a, p) => (p.t === "text" && a.length && a[a.length - 1].t === "text" ? (a[a.length - 1].v += p.v, a) : (a.push(p), a)), [])
}
/** A note's links that become cards under the text (not pictures, not video, not .fips), at most 3, as the classic
 *  feed's cardLinks; they leave the text. */
function cardLinks(parts) {
  const out = []
  for (const p of parts) if (p.t === "link" && !/^https?:\/\/[^/?#]*\.fips(:\d+)?([/?#]|$)/i.test(p.v) && !out.includes(p.v)) out.push(p.v)
  return out.slice(0, 3)
}
/** The parts with the carded links taken out, the text either side joined, the ends trimmed (classic withoutLinks). */
function withoutCards(parts, cards) {
  if (!cards.length) return parts
  const out = []
  for (const p of parts) {
    if (p.t === "link" && cards.includes(p.v)) continue
    if (p.t === "text" && out.length && out[out.length - 1].t === "text") out[out.length - 1] = { t: "text", v: out[out.length - 1].v + p.v }
    else out.push(p)
  }
  if (out[0]?.t === "text") out[0] = { t: "text", v: out[0].v.replace(/^\s+/, "") }
  const z = out.length - 1
  if (out[z]?.t === "text") out[z] = { t: "text", v: out[z].v.replace(/\s+$/, "") }
  return out.filter(p => p.t !== "text" || p.v)
}
const hostOf = url => { try { return new URL(url).hostname.replace(/^www\./, "") } catch { return url } }
// Inline marks, as the classic note text (src/net/inline-md.js, the same expression; a test keeps them equal):
// **bold** / __bold__, *italic* / _italic_, ~~strike~~ and `code`.
const MARKS = /(\*\*|__)(?=\S)(.+?)(?<=\S)\1|~~(?=\S)(.+?)(?<=\S)~~|`([^`\n]+)`|(?<![\w*_])([*_])(?=[^\s*_])(.+?)(?<=[^\s*_])\5(?![\w*_])/g
/** [{ type: "text" | "strong" | "em" | "del" | "code", text }] */
function inlineMarks(text) {
  const out = []
  let at = 0
  for (const m of String(text).matchAll(MARKS)) {
    if (m.index > at) out.push({ type: "text", text: text.slice(at, m.index) })
    if (m[2] !== undefined) out.push({ type: "strong", text: m[2] })
    else if (m[3] !== undefined) out.push({ type: "del", text: m[3] })
    else if (m[4] !== undefined) out.push({ type: "code", text: m[4] })
    else out.push({ type: "em", text: m[6] })
    at = m.index + m[0].length
  }
  if (at < text.length) out.push({ type: "text", text: text.slice(at) })
  return out
}
// What the feed shows: notes, reposts, and articles, highlights and polls (their cards are worked out by the shell).
const FEED_KINDS = [1, 6, 30023, 9802, 1068], CARD_KINDS = [30023, 9802, 1068]
/** "in 3 hours", "tomorrow": when an open poll closes (the classic card's endsIn). */
function endsIn(ts, now = Date.now() / 1000) {
  const s = ts - now
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" })
  if (s < 3600) return rtf.format(Math.max(1, Math.round(s / 60)), "minute")
  if (s < 86400) return rtf.format(Math.round(s / 3600), "hour")
  return rtf.format(Math.round(s / 86400), "day")
}
/** A poll's foot line: "N votes · Pick any · Ends in 2 hours" / "· Final results". */
function pollMeta(d, now = Date.now() / 1000) {
  return `${d.voters === 1 ? "1 vote" : `${d.voters} votes`}${d.multiple ? " · Pick any" : ""}${d.endsAt ? (d.closed ? " · Final results" : ` · Ends ${endsIn(d.endsAt, now)}`) : ""}`
}
const eTags = ev => (ev?.tags ?? []).filter(t => t[0] === "e" && HEX.test(t[1] ?? ""))
/** NIP-10: the thread's root id (marked, else the first e tag, else the note itself). */
function rootOf(ev) { const e = eTags(ev); return (e.find(t => t[3] === "root") ?? (e.some(t => t[3]) ? null : e[0]))?.[1] ?? ev.id }
/** NIP-10: the note it answers (marked reply, else marked root, else the last e tag), or null. */
function parentOf(ev) { const e = eTags(ev); if (!e.length) return null; return (e.find(t => t[3] === "reply") ?? e.find(t => t[3] === "root") ?? (e.some(t => t[3]) ? null : e[e.length - 1]))?.[1] ?? null }
/** A kind 6 repost's note, if its content carries a signed-looking one. */
function repostOf(ev) { if (ev?.kind !== 6) return null; try { const r = JSON.parse(ev.content); return r && HEX.test(r.id ?? "") && HEX.test(r.pubkey ?? "") && typeof r.content === "string" ? r : null } catch { return null } }
/** Feed rows: newest first, one per id, at most `cap`. */
function mergeNotes(have, more, cap = 400) {
  const seen = new Set(), all = []
  for (const ev of [...have, ...more]) if (ev && HEX.test(ev.id ?? "") && !seen.has(ev.id)) { seen.add(ev.id); all.push(ev) }
  return all.sort((a, b) => b.created_at - a.created_at).slice(0, cap)
}
/** A thread from its root and replies: root first, then each reply under the note it answers, oldest first. */
function threadRows(rootId, events) {
  const byParent = new Map(), byId = new Map(events.map(e => [e.id, e]))
  for (const e of events) if (e.id !== rootId) { const p = byId.has(parentOf(e)) ? parentOf(e) : rootId; if (!byParent.has(p)) byParent.set(p, []); byParent.get(p).push(e) }
  const rows = [], walk = (id, depth) => { for (const e of (byParent.get(id) ?? []).sort((a, b) => a.created_at - b.created_at)) { rows.push({ ev: e, depth }); walk(e.id, Math.min(depth + 1, 4)) } }
  if (byId.has(rootId)) rows.push({ ev: byId.get(rootId), depth: 0 })
  walk(rootId, 1)
  return rows
}
function ago(ts, now = Date.now() / 1000) {
  const s = Math.max(0, now - ts)
  return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : s < 604800 ? `${Math.floor(s / 86400)}d` : new Date(ts * 1000).toLocaleDateString()
}
// ---- end pure ----

const n = window.napplet || {}
const $ = id => document.getElementById(id)
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
const PAGE = 40
const profiles = new Map(), asked = new Set(), pics = new Map()
let me = "", follows = [], view = { kind: "feed" }, stack = [], notes = [], pending = [], live = null, loading = false, done = false

async function q(filters) { return ((await n.outbox.query(filters).catch(() => ({ events: [] }))).events ?? []).map(r => r.event).filter(Boolean) }

// Profiles: asked in batches, kept for the session.
let wanted = new Set(), wantTimer = null
function want(pk) {
  if (!HEX.test(pk) || asked.has(pk)) return
  asked.add(pk); wanted.add(pk)
  clearTimeout(wantTimer); wantTimer = setTimeout(loadProfiles, 60)
}
async function loadProfiles() {
  const pks = [...wanted]; wanted = new Set()
  for (let i = 0; i < pks.length; i += 100) {
    for (const ev of await q([{ kinds: [0], authors: pks.slice(i, i + 100), limit: 100 }])) {
      const had = profiles.get(ev.pubkey)
      if (had && had.at >= ev.created_at) continue
      try { const p = JSON.parse(ev.content); profiles.set(ev.pubkey, { at: ev.created_at, name: String(p.display_name || p.name || "").slice(0, 60), picture: typeof p.picture === "string" ? p.picture : "", about: String(p.about || "").slice(0, 600) }) } catch {}
    }
  }
  for (const node of document.querySelectorAll("[data-pk]")) paintWho(node)
}
const nameOf = pk => profiles.get(pk)?.name || `${pk.slice(0, 8)}…`
function paintWho(node) {
  const pk = node.dataset.pk, p = profiles.get(pk)
  if (node.classList.contains("av")) { if (p?.picture) picture(node, p.picture); else node.textContent = (p?.name || "?").slice(0, 1).toUpperCase() }
  else node.textContent = (node.dataset.at ? "@" : "") + nameOf(pk)
}

// Pictures: bytes from the shell (its IP rules), only once in view, a few at a time.
let inFlight = 0; const queue = []
const seen = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { seen.unobserve(e.target); queue.push(e.target); pump() } }, { rootMargin: "400px" })
function picture(node, url) { if (!/^https:\/\//i.test(url) || node.dataset.src === url) return; node.dataset.src = url; seen.observe(node) }
function pump() {
  while (inFlight < 4 && queue.length) {
    const node = queue.shift(), url = node.dataset.src
    inFlight++
    ;(pics.get(url) ?? (pics.set(url, n.resource?.bytes(url).then(b => URL.createObjectURL(b)).catch(() => "")), pics.get(url)))
      .then(src => { if (src && node.dataset.src === url) { if (node.tagName === "IMG") node.src = src; else { const i = el("img", "av"); i.alt = ""; i.src = src; i.dataset.src = url; node.replaceWith(i) } } })
      .finally(() => { inFlight--; pump() })
  }
}

function avatar(pk) {
  const b = el("button", "av"); b.type = "button"; b.dataset.pk = pk; b.setAttribute("aria-label", "Profile")
  b.onclick = e => { e.stopPropagation(); openProfile(pk) }
  want(pk); paintWho(b); return b
}
function body(ev) {
  const div = el("div", "body"), media = el("div", "media")
  const all = tokenize(ev.content), cards = cardLinks(all)
  for (const p of withoutCards(all, cards)) {
    if (p.t === "text") div.append(...marked(p.v))
    else if (p.t === "image") { const i = el("img", "zoom"); i.alt = ""; i.loading = "lazy"; i.title = "View full screen"; i.onclick = e => { e.stopPropagation(); viewMedia(ev, p.v) }; picture(i, p.v); media.append(i) }
    else if (p.t === "video") media.append(videoSlot(p.v))
    else if (p.t === "link") { const a = el("a", "", p.v.replace(/^https?:\/\//, "").slice(0, 60)); a.href = "#"; a.title = p.v; a.onclick = e => { e.preventDefault(); e.stopPropagation(); openLink(p.v) }; div.append(a) }
    else if (p.t === "tag") { const a = el("a", "tag", `#${p.v}`); a.href = "#"; a.onclick = e => { e.preventDefault(); e.stopPropagation(); go({ kind: "tag", tag: p.v.toLowerCase() }) }; div.append(a) }
    else if (p.t === "profile") { const a = el("a"); a.href = "#"; a.dataset.pk = p.v; a.dataset.at = "1"; want(p.v); paintWho(a); a.onclick = e => { e.preventDefault(); e.stopPropagation(); openProfile(p.v) }; div.append(a) }
    else if (p.t === "note") media.append(quoteCard(p.v))
  }
  for (const url of cards) media.append(linkCard(url))
  const f = document.createDocumentFragment(); f.append(div); if (media.childElementCount) f.append(media); return f
}
/** Text with its inline marks as elements (never HTML: textContent only). */
function marked(text) {
  const marks = inlineMarks(text)
  if (marks.length === 1 && marks[0].type === "text") return [text]
  return marks.map(m => m.type === "text" ? m.text : el(m.type === "strong" ? "strong" : m.type === "em" ? "em" : m.type === "del" ? "del" : "code", "", m.text))
}
// A link as a card: the domain at once, then the page's title, picture and description if the shell could read them
// (napplet:link/preview; most sites refuse a cross-site read and the card stays plain). A tap opens it through the shell.
const previews = new Map()
const cardSeen = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { cardSeen.unobserve(e.target); fillCard(e.target) } }, { rootMargin: "300px" })
function linkCard(url) {
  const a = el("a", "card"); a.href = "#"; a.title = url; a.dataset.url = url
  a.onclick = e => { e.preventDefault(); e.stopPropagation(); openLink(url) }
  const g = el("span", "glyph", "🔗"); g.setAttribute("aria-hidden", "true")
  a.append(g, el("span", "host", hostOf(url)), el("span", "dom", "↗"))
  cardSeen.observe(a)
  return a
}
function fillCard(a) {
  const url = a.dataset.url
  if (!previews.has(url)) previews.set(url, n.intent?.invoke("napplet:link/preview", { payload: { url } }).then(r => r?.ok ? r.data ?? null : null).catch(() => null) ?? Promise.resolve(null))
  previews.get(url).then(m => {
    if (!m?.title) return
    const txt = el("span", "txt")
    if (m.siteName) txt.append(el("span", "site", m.siteName))
    txt.append(el("span", "ttl", m.title))
    if (m.description) txt.append(el("span", "desc", m.description))
    txt.append(el("span", "dom", hostOf(url)))
    a.classList.add("rich"); a.replaceChildren(txt)
    if (m.image) {
      const i = el("img"); i.alt = ""; i.onerror = () => i.remove(); a.prepend(i)
      ;(pics.get(m.image) ?? (pics.set(m.image, n.resource?.bytes(m.image).then(b => URL.createObjectURL(b)).catch(() => "")), pics.get(m.image)))
        .then(src => { if (src) i.src = src; else i.remove() })
    }
  })
}
// Video: tap to load it as bytes from the shell (its IP rules), then it plays here. Nothing loads until asked.
function videoSlot(url) {
  const b = el("button", "vid", "▶ Play video")
  b.onclick = async e => {
    e.stopPropagation(); b.disabled = true; b.textContent = "Loading video…"
    try {
      const v = el("video"); v.controls = true; v.playsInline = true; v.src = URL.createObjectURL(await n.resource.bytes(url))
      v.onclick = ev => ev.stopPropagation(); b.replaceWith(v); v.play().catch(() => {})
    } catch (err) { b.disabled = false; b.textContent = "Couldn't load the video. Try again" }
  }
  return b
}
// A quoted note (nostr:note / nevent): a small card filled in from the shell; a tap opens its thread.
const quoted = new Map()
function quoteCard(id) {
  const box = el("div", "quote", "Loading the quoted note…")
  box.onclick = e => { e.stopPropagation(); go({ kind: "thread", id }) }
  ;(quoted.get(id) ?? (quoted.set(id, n.outbox.getEvent(id).then(r => r?.result?.event ?? null).catch(() => null)), quoted.get(id))).then(ev => {
    if (!ev) { box.textContent = "A note that couldn't be found."; return }
    const who = el("b"); who.dataset.pk = ev.pubkey; want(ev.pubkey); paintWho(who)
    box.replaceChildren(who, el("div", "", String(ev.content ?? "").slice(0, 280)))
  })
  return box
}
const ACT = (label, title, on) => { const b = el("button", "ghost", label); b.title = title; b.setAttribute("aria-label", title); b.onclick = e => { e.stopPropagation(); on(b) }; return b }
// Repost, Zap and ⋯ are the shell's own flows (its Send Delay with Undo, its zap picker, its block/report/delete
// dialogs); the napplet hands over the signed note, the shell checks the signature.
const shellAct = (action, ev) => n.intent?.invoke(`napplet:note/${action}`, { payload: { event: ev } }).catch(() => {})

function card(ev, { focus = false, depth = 0, by = null } = {}) {
  const shown = repostOf(ev) ?? ev
  const a = el("article", focus ? "focus" : ""); a.dataset.id = shown.id
  if (depth) a.style.paddingLeft = `${14 + Math.min(depth, 4) * 18}px`
  a.append(avatar(shown.pubkey))
  const col = el("div")
  if (by || ev.kind === 6) { const r = el("p", "rp", "↻ reposted by "); const w = el("span"); w.dataset.pk = by ?? ev.pubkey; paintWho(w); r.append(w); col.append(r) }
  const who = el("div", "who"), name = el("b"); name.dataset.pk = shown.pubkey; paintWho(name)
  name.onclick = e => { e.stopPropagation(); openProfile(shown.pubkey) }
  who.append(name, el("span", "", `· ${ago(shown.created_at)}`)); col.append(who)
  const parent = shown.kind === 1 ? parentOf(shown) : null // a highlight's e tag is its source, not a parent
  if (parent && !depth && !focus) col.append(el("div", "reply-line", "replying in a thread"))
  col.append(CARD_KINDS.includes(shown.kind) ? kindBody(shown) : body(shown))
  const acts = el("div", "acts")
  const reply = el("button", "ghost", "Reply"); reply.onclick = e => { e.stopPropagation(); compose("reply", shown) }
  const like = likeButton(shown), zap = ACT("⚡", "Zap", () => shellAct("zap", shown)); zap.dataset.zap = shown.id
  askStats(a, shown)
  acts.append(reply, ACT("⟲", "Repost", () => shellAct("repost", shown)), ACT("❝", "Quote", () => compose("quote", shown)), like,
    zap, ACT("⋯", "More", () => shellAct("menu", shown)))
  col.append(acts)
  a.append(col)
  // An article's thread is the article itself (the classic card): the shell's article reader opens.
  if (shown.kind === 30023) a.onclick = () => openArticle(shown)
  else if (!focus) a.onclick = () => go({ kind: "thread", id: shown.id, event: shown })
  return a
}

function compose(action, ev) { n.intent?.invoke(`napplet:compose/${action}`, { payload: ev ? { event: ev } : {} }).catch(() => {}) }
function openArticle(ev) { n.intent?.invoke("napplet:article/open", { payload: { event: ev } }).catch(() => {}) }
// An article, highlight or poll: its card's strings come from the shell (napplet:note/card), worked out from the signed
// event as the classic feed card does; the napplet only draws them.
const cardsAsked = new Map()
const cardOf = (ev, fresh) => {
  if (fresh || !cardsAsked.has(ev.id)) cardsAsked.set(ev.id, n.intent?.invoke("napplet:note/card", { payload: { event: ev } }).then(r => r?.ok ? r.data ?? null : null).catch(() => null) ?? Promise.resolve(null))
  return cardsAsked.get(ev.id)
}
function kindBody(ev) {
  const box = el("div", `kind k${ev.kind}`, ev.kind === 30023 ? "Loading the article…" : ev.kind === 1068 ? "Loading the poll…" : "Loading the highlight…")
  box.classList.add("muted")
  cardOf(ev).then(d => {
    box.classList.remove("muted")
    if (!d) { box.textContent = ev.kind === 1068 ? "A poll this app can't show." : String(ev.content ?? "").slice(0, 280); return }
    if (d.type === "article") drawArticle(box, d)
    else if (d.type === "highlight") drawHighlight(box, d)
    else if (d.type === "poll") drawPoll(box, ev, d)
  })
  return box
}
function bytesImg(url, cls) {
  const i = el("img", cls); i.alt = ""
  ;(pics.get(url) ?? (pics.set(url, n.resource?.bytes(url).then(b => URL.createObjectURL(b)).catch(() => "")), pics.get(url)))
    .then(src => { if (src) i.src = src; else i.remove() })
  return i
}
function drawArticle(box, d) {
  box.replaceChildren()
  if (d.image) box.append(bytesImg(d.image, "art-img"))
  box.append(el("h3", "art-title", d.title), el("div", "kmeta", `📄 ${d.meta}`))
  if (d.preview) box.append(el("p", "art-prev", d.preview))
}
function drawHighlight(box, d) {
  box.replaceChildren()
  if (d.comment) box.append(el("p", "hl-comment", d.comment))
  box.append(el("div", "kmeta", "🖍 Highlighted"), el("blockquote", "hl-passage", d.passage))
  const src = d.source
  if (src?.note) box.append(quoteCard(src.note))
  else if (src?.addr) box.append(addrCard(src.addr))
  else if (src?.url) box.append(linkCard(src.url))
}
// A highlight's article (or other addressable event) as a small card: its title, a tap opens it.
function addrCard({ kind, pubkey, d }) {
  const b = el("div", "quote", "Loading the source…")
  q([{ kinds: [kind], authors: [pubkey], "#d": [d], limit: 1 }]).then(([ev]) => {
    if (!ev) { b.textContent = "A source that couldn't be found."; return }
    const who = el("b"); who.dataset.pk = ev.pubkey; want(ev.pubkey); paintWho(who)
    const title = (ev.tags ?? []).find(t => t[0] === "title")?.[1] || String(ev.content ?? "").split("\n").find(Boolean)?.replace(/^[#\s]+/, "") || "Untitled"
    b.replaceChildren(who, el("div", "", String(title).slice(0, 200)))
    b.onclick = e => { e.stopPropagation(); ev.kind === 30023 ? openArticle(ev) : go({ kind: "thread", id: ev.id, event: ev }) }
  })
  return b
}
function drawPoll(box, ev, d, picking = null, err = "") {
  box.replaceChildren()
  if (d.question) box.append(el("p", "poll-q", d.question))
  const opts = el("div", "poll-opts"), canVote = !d.closed && !!me
  const gathered = picking ?? d.mine
  for (const o of d.options) {
    const sel = gathered.includes(o.id)
    const b = el("button", `poll-opt${sel ? " on" : ""}`); b.type = "button"; b.disabled = !canVote; b.setAttribute("aria-pressed", String(sel))
    if (d.results) { const bar = el("span", "poll-bar"); bar.style.width = `${o.pct}%`; b.append(bar) }
    b.append(el("span", "poll-mark", d.multiple ? (sel ? "☑" : "☐") : (sel ? "◉" : "○")), el("span", "poll-label", o.label))
    if (d.results) b.append(el("span", "poll-pct", `${o.pct}%`))
    b.setAttribute("aria-label", d.results ? `${o.label}, ${o.votes} votes` : o.label)
    b.onclick = e => {
      e.stopPropagation()
      if (!d.multiple) { if (!(d.mine.length === 1 && d.mine[0] === o.id)) castVote(box, ev, d, [o.id]); return }
      const cur = new Set(gathered); cur.has(o.id) ? cur.delete(o.id) : cur.add(o.id)
      drawPoll(box, ev, d, [...cur])
    }
    opts.append(b)
  }
  box.append(opts)
  const changed = d.multiple && picking && picking.length > 0 && [...picking].sort().join() !== [...d.mine].sort().join()
  if (changed) { const v = el("button", "primary poll-vote", d.mine.length ? "Change vote" : "Vote"); v.onclick = e => { e.stopPropagation(); castVote(box, ev, d, picking) }; box.append(v) }
  box.append(el("div", "kmeta", `📊 ${pollMeta(d)}`))
  if (err) { const p = el("p", "poll-err", err); p.setAttribute("role", "alert"); box.append(p) }
}
async function castVote(box, ev, d, picks) {
  for (const b of box.querySelectorAll("button")) b.disabled = true
  box.querySelector(".kmeta")?.append(" · Sending…")
  const r = await n.intent?.invoke("napplet:poll/vote", { payload: { event: ev, picks } }).catch(e => ({ ok: false, error: String(e?.message ?? e) }))
  if (r?.ok && r.data) { cardsAsked.set(ev.id, Promise.resolve(r.data)); drawPoll(box, ev, r.data) }
  else drawPoll(box, ev, d, null, r?.error || "Your vote wasn't sent.")
}
// Like and zap totals: the app's own (napplet:note/stats when a note comes into view, then inc nv.note.stats as they
// change). A tap likes or takes it back; a hold or right-click opens the tapback row; the shell signs (napplet:note/like).
const TAPBACK = ["❤️", "🤙", "🔥", "😂", "😮", "😢"]
const stats = new Map() // note id -> the shell's latest stats
const statsSeen = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { statsSeen.unobserve(e.target); const ev = e.target._ev; n.intent?.invoke("napplet:note/stats", { payload: { event: ev } }).then(r => { if (r?.ok && r.data) showStats(r.data) }).catch(() => {}) } }, { rootMargin: "300px" })
function askStats(row, ev) { row._ev = ev; if (stats.has(ev.id)) queueMicrotask(() => showStats(stats.get(ev.id))); statsSeen.observe(row) }
function showStats(d) {
  if (!d || !HEX.test(d.id ?? "")) return
  stats.set(d.id, d)
  for (const b of document.querySelectorAll(`button[data-like="${d.id}"]`)) paintLike(b, d)
  for (const b of document.querySelectorAll(`button[data-zap="${d.id}"]`)) { b.textContent = d.zapSats ? `⚡ ${d.zapSats.toLocaleString("en-US")}` : "⚡"; b.classList.toggle("on", d.zapMine); b.title = d.zapSats ? `Zap · ${d.zapSats.toLocaleString("en-US")} sats` : "Zap" }
}
function paintLike(b, d) {
  const mine = d?.like === "sent" || d?.like === "pending"
  b.textContent = mine ? (d.emoji === "❤️" || !d.emoji ? "♥ Liked" : `${d.emoji} Reacted`) : "♡ Like"
  b.classList.toggle("on", mine); b.disabled = d?.like === "busy"
  b.title = d?.like === "error" ? `Didn't go out: ${d.error}. Try again` : mine ? "Your reaction. Tap to take it back, hold to change it" : "Like. Hold for more reactions"
}
function likeButton(ev) {
  const b = el("button", "ghost", "♡ Like"); b.dataset.like = ev.id; paintLike(b, stats.get(ev.id))
  const send = emoji => n.intent?.invoke("napplet:note/like", { payload: { event: ev, ...(emoji ? { emoji } : {}) } }).then(r => { if (r && !r.ok) b.title = r.error || "Not sent" }).catch(() => {})
  let timer = null, held = false
  b.onpointerdown = () => { held = false; timer = setTimeout(() => { held = true; tapback(b, send) }, 350) }
  b.onpointerup = b.onpointerleave = () => clearTimeout(timer)
  b.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); clearTimeout(timer); tapback(b, send) }
  b.onclick = e => { e.stopPropagation(); if (held) { held = false; return } send() }
  return b
}
function tapback(b, send) {
  document.querySelector(".tapback")?.remove()
  const bar = el("div", "tapback"); bar.setAttribute("role", "menu")
  for (const e of TAPBACK) { const x = el("button", "", e); x.type = "button"; x.setAttribute("role", "menuitem"); x.onclick = ev => { ev.stopPropagation(); bar.remove(); send(e) }; bar.append(x) }
  b.after(bar)
  const away = ev => { if (!bar.contains(ev.target)) { bar.remove(); removeEventListener("pointerdown", away, true) } }
  setTimeout(() => addEventListener("pointerdown", away, true))
}
// A tap on a picture: the shell's own full-screen viewer, over the whole app, from the signed note's media.
function viewMedia(ev, url) { n.intent?.invoke("napplet:media/view", { payload: { event: ev, url } }).catch(() => {}) }
function openLink(url) { n.intent?.invoke("napplet:link/open", { payload: { url } }).catch(() => {}) }

// Someone's profile: the app's full profile screen (napplet:profile/show), this frame kept under it. Only when the shell
// has no such screen does the small one here open.
function openProfile(pk) {
  const fallback = () => go({ kind: "profile", pubkey: pk })
  const r = n.intent?.invoke("napplet:profile/show", { payload: { pubkey: pk } })
  if (!r) return fallback()
  r.then(x => { if (!x?.ok) fallback() }, fallback)
}
function go(next, push = true) {
  if (push) stack.push(view)
  view = next; stopLive(); render()
}
$("back").onclick = () => { if (stack.length) { view = stack.pop(); stopLive(); render() } }
$("new").onclick = () => compose("new")
$("fresh").onclick = () => { notes = mergeNotes(pending, notes); pending = []; $("fresh").hidden = true; drawFeed(); scrollTo(0, 0) }
function stopLive() { live?.close?.(); live = null; pending = []; $("fresh").hidden = true }

async function render() {
  $("back").hidden = !stack.length
  $("list").replaceChildren(); $("foot").textContent = "Loading…"; $("list").setAttribute("aria-busy", "true")
  if (view.kind === "feed") return showFeed()
  if (view.kind === "thread") return showThread(view.id, view.event)
  if (view.kind === "profile") return showProfile(view.pubkey)
  if (view.kind === "tag") return showTag(view.tag)
}

// A #tag's notes, as the shell gives them: your vault first, then relays, and only people in your web (the shell's
// rule for every napplet read), so it is the tag among the people you trust, not everyone's.
async function showTag(tag) {
  $("title").textContent = `#${tag}`
  const evs = await q([{ kinds: [1], "#t": [tag], limit: PAGE }])
  if (view.kind !== "tag" || view.tag !== tag) return
  const rows = mergeNotes([], evs)
  $("list").replaceChildren(...rows.map(ev => card(ev)))
  $("list").setAttribute("aria-busy", "false")
  $("foot").replaceChildren()
  $("foot").textContent = rows.length ? "Notes with this tag from people in your web." : `No notes with #${tag} from people in your web yet.`
}

async function showFeed() {
  $("title").textContent = "Following"
  if (!follows.length) follows = await n.identity.getFollows().catch(() => [])
  const authors = [...new Set([me, ...follows])].filter(Boolean)
  if (!notes.length) { notes = mergeNotes([], await q([{ kinds: FEED_KINDS, authors, limit: PAGE }])); done = false }
  drawFeed()
  const since = Math.floor(Date.now() / 1000)
  live = n.outbox.subscribe([{ kinds: FEED_KINDS, authors, since }])
  live.on("event", r => { const ev = r.event; if (!ev || notes.some(x => x.id === ev.id) || pending.some(x => x.id === ev.id)) return; if (ev.pubkey === me) { notes = mergeNotes([ev], notes); drawFeed() } else { pending.push(ev); $("fresh").hidden = false; $("fresh").textContent = `${pending.length} new` } })
}
function drawFeed() {
  const list = $("list"); list.replaceChildren(...notes.map(ev => card(ev)))
  list.setAttribute("aria-busy", "false")
  $("foot").replaceChildren()
  if (!notes.length) { $("foot").textContent = follows.length ? "No notes yet." : "Follow people to fill this feed."; return }
  if (!done) { const more = el("button", "", "Older notes"); more.onclick = loadOlder; $("foot").append(more) }
}
async function loadOlder() {
  if (loading || view.kind !== "feed") return
  loading = true
  const until = notes[notes.length - 1]?.created_at - 1
  const older = await q([{ kinds: FEED_KINDS, authors: [...new Set([me, ...follows])], until, limit: PAGE }])
  loading = false
  if (!older.length) done = true
  notes = mergeNotes(notes, older); drawFeed()
}

async function showThread(id, given) {
  $("title").textContent = "Thread"
  let focus = given ?? (await q([{ ids: [id], limit: 1 }]))[0]
  if (!focus) { $("foot").textContent = "Couldn't find this note."; return }
  const rootId = rootOf(focus)
  const [root] = rootId === focus.id ? [focus] : await q([{ ids: [rootId], limit: 1 }])
  const replies = await q([{ kinds: [1], "#e": [rootId], limit: 300 }])
  const rows = threadRows(rootId, [...(root ? [root] : []), focus, ...replies])
  if (!root) rows.unshift({ ev: focus, depth: 0 })
  $("list").replaceChildren(...rows.map(r => card(r.ev, { focus: r.ev.id === focus.id, depth: r.depth })))
  $("list").setAttribute("aria-busy", "false")
  $("foot").textContent = replies.length ? "" : "No replies yet."
  $("list").querySelector("article.focus")?.scrollIntoView({ block: "center" })
}

async function showProfile(pk) {
  want(pk); $("title").dataset.pk = pk; $("title").textContent = nameOf(pk)
  const head = el("section", "prof"), top = el("div", "top"), av = avatar(pk), name = el("h2"); name.dataset.pk = pk; paintWho(name)
  top.append(av, el("div")); top.lastChild.append(name, el("div", "muted", `${pk.slice(0, 12)}…`)); head.append(top)
  const about = el("p"); head.append(about)
  const fill = () => { about.textContent = profiles.get(pk)?.about ?? ""; $("title").textContent = nameOf(pk) }
  setTimeout(fill, 600)
  const evs = await q([{ kinds: FEED_KINDS, authors: [pk], limit: PAGE }])
  fill()
  $("list").replaceChildren(head, ...mergeNotes([], evs).map(ev => card(ev)))
  $("list").setAttribute("aria-busy", "false")
  $("foot").textContent = evs.length ? "" : "No notes from them yet."
}

async function start() {
  if (n.theme?.get) { try { const t = await n.theme.get(); const c = t?.colors ?? {}; const r = document.documentElement.style; if (c.background) r.setProperty("--bg", c.background); if (c.text) r.setProperty("--text", c.text); if (c.primary) r.setProperty("--accent", c.primary) } catch {} }
  me = await n.identity.getPublicKey().catch(() => "")
  // The shell opens a note or a profile here by intent; a reply this account just posted lands in the thread at once.
  n.intent?.onDelivery?.(d => {
    const p = d?.payload ?? {}
    if (d.archetype === "note" && d.action !== "removed" && HEX.test(p.id ?? "")) go({ kind: "thread", id: p.id }, view.kind !== "feed" || stack.length > 0)
    else if (d.archetype === "profile" && HEX.test(p.pubkey ?? "")) go({ kind: "profile", pubkey: p.pubkey }, view.kind !== "feed" || stack.length > 0)
    else if (d.archetype === "feed" && typeof p.tag === "string" && /^[\p{L}\p{N}_]{1,64}$/u.test(p.tag)) go({ kind: "tag", tag: p.tag.toLowerCase() })
    else if (d.archetype === "feed") { stack = []; go({ kind: "feed" }, false) }
    else if (d.archetype === "note" && d.action === "removed" && HEX.test(p.id ?? "")) {
      // Deleted from the ⋯ menu: gone from the feed at once, and from a thread or profile on screen.
      notes = notes.filter(x => x.id !== p.id && (repostOf(x)?.id !== p.id))
      for (const a of document.querySelectorAll(`article[data-id="${p.id}"]`)) a.remove()
      if (view.kind === "feed") drawFeed()
    }
  })
  n.inc?.on?.("nv.note.stats", e => showStats(e?.payload))
  n.inc?.on?.("nv.compose.sent", e => {
    const ev = e?.payload?.event
    if (!ev || !HEX.test(ev.id ?? "")) return
    if (view.kind === "feed") { notes = mergeNotes([ev], notes); drawFeed() }
    else if (view.kind === "thread") showThread(view.id, view.event)
  })
  render()
}
start()
</script>
</body>
