<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On this day</title>
<style>
  /* A card's body only (plan step 4): the shell draws the header (icon, name, edit tools). */
  :root { color-scheme: dark; --bg: #1c1c1e; --s2: #2c2c2e; --text: #fff; --text-2: rgb(255 255 255 / .60); --text-3: rgb(255 255 255 / .38); --accent: #e67326;
    font: 13px/1.35 -apple-system, system-ui, sans-serif; }
  html, body { margin: 0; background: var(--s1, var(--bg)); color: var(--text); }
  html.sized, html.sized body { height: 100%; }
  html.sized body { overflow-y: auto; overscroll-behavior: contain; }
  ul { list-style: none; margin: 0; padding: 4px 0; }
  .empty { padding: 16px 14px; color: var(--text-2); }
  .year { padding: 8px 14px 2px; color: var(--accent-light, var(--accent)); font-weight: 600; font-size: 12px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; padding: 6px 14px;
    border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .row:hover { background: var(--s2); }
  .text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  time { font-size: 11px; color: var(--text-3); padding-top: 2px; }
</style>
</head>
<body>
<ul id="rows"><li class="empty">Reading your vault…</li></ul>
<script>
/*@nv-theme*/
  // On this day as a card (plan step 4). The shell reads the user's own notes from this date in past years out of
  // their vault (on-this-day.js) and answers napplet:space/thisday with only the lines this card draws; a click opens
  // the note in the app (napplet:note/show). It asks again when the local day changes, and when the shell says (inc nv.card.again).
  const n = window.napplet || {}
  nvTheme(n)
  const $ = id => document.getElementById(id)
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  const ask = (what, payload = {}) => n.intent ? n.intent.invoke(what, { payload }).then(r => (r && r.ok ? r.data : null)).catch(() => null) : Promise.resolve(null)
  function draw(years) {
    const ul = $("rows")
    ul.replaceChildren()
    if (!years) { ul.append(el("li", "empty", "Couldn't read your vault.")); return }
    if (!years.length) ul.append(el("li", "empty", "Nothing from this day in past years."))
    for (const y of years) {
      ul.append(el("li", "year", y.label))
      for (const note of y.notes) {
        const at = new Date(note.at * 1000)
        const b = el("button", "row"); b.type = "button"
        const t = el("time", "", at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })); t.dateTime = at.toISOString()
        b.append(el("span", "text", note.text), t)
        b.onclick = () => ask("napplet:note/show", { id: note.id })
        const li = el("li"); li.append(b); ul.append(li)
      }
    }
  }
  ask("napplet:shell/surface").then(s => { if (s && s.size) document.documentElement.classList.add("sized") })
  new ResizeObserver(() => ask("napplet:card/height", { height: $("rows").scrollHeight })).observe($("rows"))
  const dayOf = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` }
  let day = dayOf()
  const read = () => ask("napplet:space/thisday").then(draw)
  read()
  if (n.inc && n.inc.on) n.inc.on("nv.card.again", read)
  setInterval(() => { if (dayOf() !== day) { day = dayOf(); read() } }, 60 * 1000)
</script>
</body>
</html>
