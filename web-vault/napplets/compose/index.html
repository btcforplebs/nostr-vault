<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose</title>
<style>
  :root { color-scheme: dark; --bg: #000; --text: #f2f2f2; --muted: #9a9a9f; --hair: #26262a; --s2: #1c1c1f; --accent: #e67326;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
  .to { color: var(--muted); font-size: 13px; border-left: 3px solid var(--hair); padding: 4px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; }
  textarea { flex: 1; min-height: 140px; width: 100%; resize: none; background: var(--s2); color: inherit; border: 1px solid var(--hair); border-radius: 12px; padding: 12px; font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row span { flex: 1; color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; min-height: 40px; padding: 0 18px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 650; }
  button:disabled { opacity: .45; cursor: default; }
  .add { font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; cursor: pointer; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .files span { background: var(--s2); border: 1px solid var(--hair); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .files button { min-height: 28px; padding: 0 8px; }
</style>
</head>
<body>
<div id="to" class="to" hidden></div>
<textarea id="text" placeholder="What's happening?" aria-label="Note"></textarea>
<div id="quote" class="to" hidden></div>
<div id="files" class="files"></div>
<div class="row"><label class="add" id="addLabel" title="Add a photo or video">＋ Photo<input id="add" type="file" accept="image/*,video/*" hidden></label><span id="status" role="status"></span><button id="cancel">Cancel</button><button id="post" class="primary" disabled>Post</button></div>
<script>
// The Compose napplet (plan P4): a note or a reply, signed by the shell (outbox.publish; this frame has no key). Opened
// by intent: napplet:compose/new, or napplet:compose/reply with { event } (the note answered, NIP-10 marked tags). A
// draft is kept per note answered in this napplet's storage until it is sent. Quote (napplet:compose/quote { event })
// and photos (uploaded through the shell) as the classic composer makes them; the shell's Send Delay applies. When it is sent, "nv.compose.sent"
// { event } goes out so the Reader shows it at once; "nv.compose.done" tells the shell to close the sheet.

// ---- pure (test/napplet-reader.test.mjs loads this block) ----
const HEX = /^[0-9a-f]{64}$/
const MAX_NOTE = 20000
// NIP-10 reply tags, as net/actions.js replyTags builds them (ported whole): a root gets one "root" e tag; a reply
// gets the thread's root plus a "reply" e tag for itself; then the parent's author and everyone it tagged, once each.
function replyTags(parent) {
  const es = (parent.tags ?? []).filter(t => t[0] === "e" && HEX.test(t[1] ?? "") && t[3] !== "mention")
  const tags = []
  if (!es.length) tags.push(["e", parent.id, "", "root", parent.pubkey])
  else {
    const root = es.find(t => t[3] === "root") ?? es[0]
    tags.push(HEX.test(root[4] ?? "") ? ["e", root[1], "", "root", root[4]] : ["e", root[1], "", "root"])
    tags.push(["e", parent.id, "", "reply", parent.pubkey])
  }
  const seen = new Set()
  for (const pk of [parent.pubkey, ...(parent.tags ?? []).filter(t => t[0] === "p").map(t => t[1])])
    if (HEX.test(pk ?? "") && !seen.has(pk)) { seen.add(pk); tags.push(["p", pk]) }
  return tags
}
// bech32 (NIP-19) for a quote's nevent: TLV 3 kind (4 bytes, big endian), 2 author, 0 id.
const B32 = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
function polymod(v) { const G = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3]; let c = 1; for (const x of v) { const b = c >> 25; c = ((c & 0x1ffffff) << 5) ^ x; for (let i = 0; i < 5; i++) if ((b >> i) & 1) c ^= G[i] } return c }
function bech32(prefix, bytes) {
  const words = []; let acc = 0, bits = 0
  for (const x of bytes) { acc = (acc << 8) | x; bits += 8; while (bits >= 5) { bits -= 5; words.push((acc >> bits) & 31) } }
  if (bits) words.push((acc << (5 - bits)) & 31)
  const hrp = [...prefix].map(c => c.charCodeAt(0)), exp = [...hrp.map(c => c >> 5), 0, ...hrp.map(c => c & 31)]
  const pm = polymod([...exp, ...words, 0, 0, 0, 0, 0, 0]) ^ 1
  const check = [0, 1, 2, 3, 4, 5].map(i => (pm >> (5 * (5 - i))) & 31)
  return prefix + "1" + [...words, ...check].map(w => B32[w]).join("")
}
const hexBytes = h => h.match(/../g).map(b => parseInt(b, 16))
function neventOf(ev) {
  const k = ev.kind >>> 0
  // The order nostr-tools writes (kind, author, id), so a quote is byte for byte the classic composer's.
  return bech32("nevent", [3, 4, (k >>> 24) & 255, (k >>> 16) & 255, (k >>> 8) & 255, k & 255, 2, 32, ...hexBytes(ev.pubkey), 0, 32, ...hexBytes(ev.id)])
}
/** A quote, as net/actions.js quoteOf: the nevent line after the text, a q tag, the quoted author tagged. */
const quoteOf = (quoted, text) => ({ content: `${text}\nnostr:${neventOf(quoted)}`, tags: [["q", quoted.id, "", quoted.pubkey], ["p", quoted.pubkey]] })
/** NIP-92 imeta for one uploaded file (net/upload.js imetaTag's fields). */
function imetaTag(m) {
  if (!m?.url) return null
  const f = [`url ${m.url}`]
  if (m.mime) f.push(`m ${m.mime}`)
  if (m.sha256) f.push(`x ${m.sha256}`)
  if (m.size > 0) f.push(`size ${m.size}`)
  return ["imeta", ...f]
}
/** What Post sends -> { kind, content, tags } or null when there is nothing to send. Hashtags become t tags; a quote
 *  adds its nevent line and q tag; uploaded files add their links and imeta tags. */
function noteTemplate(text, parent, { quote = null, media = [] } = {}) {
  let content = String(text ?? "").trim()
  const files = media.filter(m => /^https:\/\//i.test(m?.url ?? ""))
  if (files.length) content = [content, ...files.map(m => m.url)].filter(Boolean).join("\n")
  if (!content && !quote) return null
  const okQuote = quote && HEX.test(quote.id ?? "") && HEX.test(quote.pubkey ?? "") && Number.isInteger(quote.kind)
  let tags = parent && HEX.test(parent.id ?? "") && HEX.test(parent.pubkey ?? "") ? replyTags(parent) : []
  if (okQuote) { const q = quoteOf(quote, content); content = q.content.replace(/^\n/, ""); tags = [...tags, ...q.tags] }
  if (!content || content.length > MAX_NOTE) return null
  for (const m of files) { const t = imetaTag(m); if (t) tags.push(t) }
  for (const t of new Set([...content.matchAll(/(?:^|\s)#([\p{L}\p{N}_]{1,64})/gu)].map(m => m[1].toLowerCase()))) tags.push(["t", t])
  return { kind: 1, content, tags }
}
// ---- end pure ----

const n = window.napplet || {}
const $ = id => document.getElementById(id)
let parent = null, quote = null, media = [], sending = false, uploading = 0
const draftKey = () => `draft:${parent?.id ?? (quote ? `q:${quote.id}` : "new")}`
const status = t => { $("status").textContent = t }
const template = () => noteTemplate($("text").value, parent, { quote, media })
const sync = () => { $("post").disabled = sending || uploading > 0 || !template() }
function drawFiles() {
  $("files").replaceChildren(...media.map((m, i) => { const s = document.createElement("span"), x = document.createElement("button"); s.textContent = m.name || "file"; x.textContent = "✕"; x.setAttribute("aria-label", `Remove ${m.name || "file"}`); x.onclick = () => { media.splice(i, 1); drawFiles(); sync() }; s.append(x); return s }))
}
// A photo or video: uploaded through the shell (NAP-UPLOAD to your media servers); its link and imeta go in the note.
/** A long upload is answered "uploading" (the shell answers within 20 s and carries on): its end comes as
 *  upload.status.changed, and upload.status every 15 s catches one this missed. */
function finished(r, waiting = () => {}) {
  if (!r || (r.status !== "uploading" && r.status !== "pending")) return Promise.resolve(r)
  waiting()
  return new Promise(res => {
    let sub = null, t = 0
    const done = st => { if (st?.uploadId !== r.uploadId || st.status === "uploading" || st.status === "pending") return; sub?.close(); clearInterval(t); res(st) }
    sub = n.upload.onStatus?.(done) ?? null
    t = setInterval(() => n.upload.status?.(r.uploadId).then(done).catch(() => {}), 15000)
  })
}
$("add").onchange = async e => {
  const f = e.target.files?.[0]; e.target.value = ""
  if (!f || !n.upload) return
  uploading++; sync(); status(`Uploading ${f.name}…`)
  try {
    const r = await finished(await n.upload.upload({ data: f, mimeType: f.type, filename: f.name }), () => status(`Uploading ${f.name}… still going, it's a big one`))
    if (!r?.ok) throw new Error(r?.error || "not uploaded")
    media.push({ url: r.url, mime: r.mimeType || f.type, sha256: r.sha256, size: r.size, name: f.name }); drawFiles(); status("")
  } catch (err) { status(`${f.name}: ${err.message}`) }
  uploading--; sync()
}

async function open(d) {
  const p = d?.payload ?? {}
  parent = d?.action === "reply" && p.event && HEX.test(p.event.id ?? "") ? p.event : null
  quote = d?.action === "quote" && p.event && HEX.test(p.event.id ?? "") ? p.event : null
  media = []; drawFiles()
  $("quote").hidden = !quote
  $("quote").textContent = quote ? `Quoting: ${String(quote.content ?? "").slice(0, 280)}` : ""
  $("addLabel").hidden = !n.upload
  $("to").hidden = !parent
  $("to").textContent = parent ? `Replying to: ${String(parent.content ?? "").slice(0, 280)}` : ""
  $("text").placeholder = parent ? "Write your reply" : quote ? "Add your comment" : "What's happening?"
  $("text").value = (await n.storage?.getItem(draftKey()).catch(() => null)) ?? ""
  status(""); sync(); $("text").focus()
}
let saveTimer = null
$("text").addEventListener("input", () => {
  sync()
  clearTimeout(saveTimer)
  saveTimer = setTimeout(() => n.storage?.setItem(draftKey(), $("text").value).catch(() => {}), 300)
})
$("cancel").onclick = () => n.inc?.emit("nv.compose.done", { sent: false })
$("post").onclick = async () => {
  const t = template()
  if (!t || sending) return
  // The shell holds it for your Send Delay first, with Undo in its pill; this sheet waits, so an Undo keeps your text.
  sending = true; sync(); status("Sending…")
  n.inc?.emit("nv.compose.waiting", {}) // the shell steps this sheet aside so its pill's Undo can be reached
  const r = await n.outbox.publish(t).catch(e => ({ ok: false, error: String(e?.message ?? e) }))
  sending = false
  if (r?.ok === false) {
    n.inc?.emit("nv.compose.undone", {}) // back, with the text as it was
    status(r.error === "undone" ? "Undone. Edit it and post again, or cancel." : `Not sent: ${r.error || "no relay took it"}`); sync(); $("text").focus(); return
  }
  clearTimeout(saveTimer)
  await n.storage?.removeItem(draftKey()).catch(() => {})
  $("text").value = ""; media = []; drawFiles(); status("Sent."); sync()
  if (r?.event) n.inc?.emit("nv.compose.sent", { event: r.event })
  n.inc?.emit("nv.compose.done", { sent: true })
}
if (n.theme?.get) n.theme.get().then(t => { const c = t?.colors ?? {}, r = document.documentElement.style; if (c.background) r.setProperty("--bg", c.background); if (c.text) r.setProperty("--text", c.text); if (c.primary) r.setProperty("--accent", c.primary) }).catch(() => {})
n.intent?.onDelivery?.(open)
</script>
</body>
</html>
