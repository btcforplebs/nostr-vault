<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messages</title>
<style>
  /* A card's body only (plan step 4): the shell draws the header (icon, name, count, edit tools) and the footer link. */
  :root { color-scheme: dark; --bg: #1c1c1e; --s2: #2c2c2e; --text: #fff; --text-2: rgb(255 255 255 / .60); --text-3: rgb(255 255 255 / .38); --accent: #e67326;
    font: 13px/1.35 -apple-system, system-ui, sans-serif; }
  html, body { margin: 0; background: var(--s1, var(--bg)); color: var(--text); }
  html.sized, html.sized body { height: 100%; }
  html.sized body { overflow-y: auto; overscroll-behavior: contain; }
  ul { list-style: none; margin: 0; padding: 4px 0; }
  .empty { padding: 16px 14px; color: var(--text-2); }
  .row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; height: 58px; padding: 0 12px;
    border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .row:hover { background: var(--s2); }
  .av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--s2); color: var(--text-2); font-weight: 700; }
  .main { display: grid; min-width: 0; }
  .who, .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who { color: var(--text-2); }
  .who b { color: var(--text); font-weight: 600; }
  .text { color: var(--text-3); }
  .unread .text { color: var(--text-2); }
  .side { display: grid; justify-items: end; gap: 4px; }
  time { font-size: 11px; color: var(--text-3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .n { min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--on-badge, #fff); font: 700 10px/16px -apple-system, system-ui, sans-serif; text-align: center; }

</style>
</head>
<body>
<div id="card"><ul id="rows"><li class="empty">Reading your messages…</li></ul></div>
<script>
/*@nv-theme*/
  const n = window.napplet || {}
  nvTheme(n)
  const $ = id => document.getElementById(id)
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  const ask = (what, payload = {}) => n.intent ? n.intent.invoke(what, { payload }).then(r => (r && r.ok ? r.data : null)).catch(() => null) : Promise.resolve(null)
  const pics = new Map()
  // A face: the first letter, swapped for the picture once it comes through resource (the shell's IP rules).
  function face(row, size = 32) {
    const f = el("span", "av", (row.name || "?").slice(0, 1).toUpperCase())
    if (n.resource && /^https:\/\//i.test(row.picture || "")) {
      if (!pics.has(row.picture)) pics.set(row.picture, n.resource.bytes(row.picture).then(b => URL.createObjectURL(b)).catch(() => ""))
      pics.get(row.picture).then(src => { if (src) { const i = el("img", "av"); i.alt = ""; i.src = src; f.replaceWith(i) } })
    }
    return f
  }
  const ago = at => {
    const s = Math.max(0, Math.floor(Date.now() / 1000) - at)
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : s < 30 * 86400 ? `${Math.floor(s / 86400)}d` : new Date(at * 1000).toLocaleDateString()
  }
  const stamp = at => { const t = el("time", "", ago(at)); t.dateTime = new Date(at * 1000).toISOString(); return t }
  // Fit: tell the shell this card's height; S/M/L: the shell fixes it and this scrolls.
  ask("napplet:shell/surface").then(s => { if (s && s.size) document.documentElement.classList.add("sized") })
  new ResizeObserver(() => ask("napplet:card/height", { height: $("card").scrollHeight })).observe($("card"))
  // Messages as a card (plan step 4). The shell reads the chats with the panel's rules (usePeek: the inbox, unread
  // first, requests and blocked people left out) and answers napplet:space/messages with each chat's name and last line
  // only. Nothing is typed here: a click hands back the chat's id and the shell opens it (napplet:space/open).
  function draw(d) {
    const ul = $("rows")
    ul.replaceChildren()
    if (!d) { ul.append(el("li", "empty", "Reading your messages…")); return }
    if (d.status) ul.append(el("li", "empty", d.status))
    for (const r of d.rows) {
      const b = el("button", r.unread ? "row unread" : "row"); b.type = "button"
      const who = el("span", "who"); who.append(el("b", "", r.name))
      const main = el("span", "main"); main.append(who, el("span", "text", r.text))
      const side = el("span", "side"); side.append(stamp(r.at))
      if (r.unread > 1) side.append(el("span", "n", r.unread > 99 ? "99+" : String(r.unread))); else if (r.unread) side.append(el("span", "dot"))
      b.append(face(r), main, side)
      b.onclick = () => ask("napplet:space/open", { id: r.id })
      const li = el("li"); li.append(b); ul.append(li)
    }
  }
  // Draws only when the answer changed: a redraw under the pointer would lose a click, and moves nothing for nothing.
  let drawn = null
  const fresh = d => { const k = JSON.stringify(d); if (k !== drawn) { drawn = k; draw(d) } }
  const look = () => ask("napplet:space/messages").then(fresh)
  look()
  if (n.inc && n.inc.on) n.inc.on("nv.card.again", look)
</script>
</body>
</html>
