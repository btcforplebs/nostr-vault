<!doctype html>
<html><head><meta charset="utf-8"><title>napplet</title></head><body><script>
// The napplet loader (src/napplet/host.js, docs/napplets/P0_SPIKE.md): served with its own CSP (website/nginx.conf,
// vite.config.js), framed sandbox="allow-scripts" (origin null). It says ready once; the shell answers with the
// checked napplet document, and this page replaces itself with it. Nothing else is accepted, and only once.
(function () {
  var done = false
  addEventListener("message", function (e) {
    if (done || e.source !== parent || !e.data || e.data.type !== "nv-loader.write" || typeof e.data.html !== "string") return
    done = true
    document.open()
    document.write(e.data.html)
    document.close()
  })
  parent.postMessage({ type: "nv-loader.ready" }, "*")
})()
</script></body></html>
