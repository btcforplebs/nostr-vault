name: Linux Flatpak

# Builds the Nostr Vault Flatpak (linux/flatpak) for x86_64 and aarch64, each on its own runner, with no network in
# the build itself (gen-sources.sh lays out every source first). Then installs the bundle and runs the window's
# Flatpak code inside it (test/smoke.py). Publishes nothing: the .flatpak files are run artifacts (14 days).
on:
  workflow_dispatch:
  push:
    branches: ["tao/flatpak*"]
  pull_request:
    paths:
      - "linux/flatpak/**"
      - "linux/native/desktop/**"
      - "linux/native/test/window-test.sh"
      - "linux/native/test/ua-probe.py"
      - ".github/workflows/linux-flatpak.yml"

# Read-only token: the build runs npm and Go tooling.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is the commit count, as the .deb's
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: haven-go/go.mod
          cache: false
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common xvfb # eu-strip and the SVG loader icon checks use, both run on the host
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pipx install "git+https://github.com/flatpak/flatpak-builder-tools.git@9d86d336a39b9af38b86f114b6ce5820fe260f91#subdirectory=node"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Sources
        run: linux/flatpak/gen-sources.sh
      - name: Build (offline)
        working-directory: linux/flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean --sandbox \
            --repo=repo --default-branch=stable builddir app.nostrvault.Desktop.yml
          . .build/src/nv-version.env
          echo "NV_VERSION=$NV_VERSION" >> "$GITHUB_ENV"
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "nostr-vault-$NV_VERSION-${{ matrix.arch }}.flatpak" app.nostrvault.Desktop stable
          ls -l *.flatpak
      - name: Install and smoke test
        working-directory: linux/flatpak
        run: |
          flatpak install --user -y --noninteractive nostr-vault-*.flatpak
          flatpak info --user app.nostrvault.Desktop
          (cd ../native/test/keytool && go build -o "$RUNNER_TEMP/keytool" .)
          npub=$("$RUNNER_TEMP/keytool" gen | cut -d' ' -f2)
          # The window before setup (its setup page), X11 and Wayland: linux/native/test/window-test.sh.
          sudo apt-get install -y -q --no-install-recommends sway grim imagemagick
          r=0
          # (The setup stage also reads the user agent the window gives its pages, with the Flatpak's own Python.)
          for m in x11 wayland; do NV_WT_CMD="flatpak run app.nostrvault.Desktop" NV_WT_CONTROL=0 \
            NV_WT_PY="flatpak run --command=python3 app.nostrvault.Desktop -I" NV_WT_BIN=/app/bin/nostr-vault-desktop \
            sh ../native/test/window-test.sh $m setup "$RUNNER_TEMP/window" || r=1; done
          xvfb-run -a flatpak run --env=NV_TEST_NPUB="$npub" --command=python3 app.nostrvault.Desktop -I - < test/smoke.py
          # The runtime's WebKitGTK (Tron, beta 6: not checked). 2.54.0 and 2.54.1 crash on a paste with an empty
          # clipboard: there the window's paste guard must be on. Read with the window's own code (webkit_version,
          # PASTE_GUARD) inside the Flatpak.
          wk=$(xvfb-run -a flatpak run --command=python3 app.nostrvault.Desktop -I -c '
          import importlib.machinery as M, importlib.util as U
          l = M.SourceFileLoader("nv", "/app/bin/nostr-vault-desktop"); m = U.module_from_spec(U.spec_from_loader("nv", l)); l.exec_module(m)
          print("%d.%d.%d %s" % (*m.webkit_version(), m.PASTE_GUARD))' | tail -1)
          echo "Flatpak runtime WebKitGTK and paste guard: $wk"
          case "$wk" in
            2.54.0\ True|2.54.1\ True) echo "PASS: WebKitGTK ${wk% *} has the paste crash and the guard is on" ;;
            2.54.0\ *|2.54.1\ *) echo "FAIL: WebKitGTK ${wk% *} has the paste crash but the guard is off"; r=1 ;;
            [0-9]*\ False) echo "PASS: WebKitGTK ${wk% *} doesn't have the paste crash; the guard is off" ;;
            *) echo "FAIL: couldn't read the Flatpak's WebKitGTK version: '$wk'"; r=1 ;;
          esac
          # Set up now: the window starts its own vault and must draw the web app, then the page after a killed one.
          # (No control run: a Flatpak can't run a copy of its own script. The .deb's window test runs it.)
          for m in x11 wayland; do NV_WT_CMD="flatpak run app.nostrvault.Desktop" NV_WT_CONTROL=0 sh ../native/test/window-test.sh $m vault "$RUNNER_TEMP/window" || r=1; done
          exit $r
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-flatpak-${{ matrix.arch }}
          path: ${{ runner.temp }}/window/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: nostr-vault-flatpak-${{ matrix.arch }}
          path: linux/flatpak/*.flatpak
          retention-days: 14
