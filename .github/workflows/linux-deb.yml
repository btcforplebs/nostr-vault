name: Linux .deb, .rpm and Arch

# Builds the nostr-vault .deb for amd64 and arm64 (linux/native/build.sh, on Debian 12 as its header asks, each arch
# on its own runner so nothing is cross-built), and from the same files the Fedora .rpm and the Arch package
# (linux/native/nfpm.sh). Then installs each one and runs linux/native/test/install-test.sh against it: the .deb on a
# fresh Ubuntu runner, the .rpm and Arch package in Fedora and Arch containers booted with systemd, which are then
# restarted to check the vault comes back on boot. Publishes nothing: the packages are run artifacts (14 days).
on:
  workflow_dispatch:
  push:
    branches: ["tom/linux-*"]
  pull_request:
    paths:
      - "linux/native/**"
      - "linux/mesh/**"
      - ".github/workflows/linux-deb.yml"

# Read-only token: the build runs npm, cargo build scripts and rustup, and the repo default is write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Build tools (as linux/mesh/Dockerfile, plus dpkg-dev; rpm and zstd to read the .rpm and Arch package back)
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git curl ca-certificates build-essential clang libclang-dev \
            libnftnl-dev libmnl-dev libdbus-1-dev pkg-config dpkg-dev binutils python3 xz-utils \
            rpm zstd
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh's version is the commit count
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: No token left in the checkout (the build runs third-party code)
        run: |
          if git config --get-regexp 'http\..*extraheader'; then echo "checkout left a token in .git/config"; exit 1; fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: haven-go/go.mod
          cache-dependency-path: haven-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Rust (linux/mesh/rust-toolchain.toml pins the version)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' linux/mesh/rust-toolchain.toml)" --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: nfpm (makes the .rpm and the Arch package)
        run: GOTOOLCHAIN=auto GOBIN=/usr/local/bin go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
      - name: Build
        run: NV_PKG_FORMATS="rpm archlinux" linux/native/build.sh ${{ matrix.arch }}
      - name: What was built
        run: |
          cd linux/native/out
          ls -l
          cat nostr-vault-linux.json
          for d in *.deb; do dpkg-deb -I "$d" control | grep -E '^(Version|Architecture|Depends):'; done
          test "$(dpkg-deb -f nostr-vault_*_${{ matrix.arch }}.deb Architecture)" = ${{ matrix.arch }}
          # One of each, for this arch, the same version as the .deb.
          case ${{ matrix.arch }} in amd64) m=x86_64 ;; arm64) m=aarch64 ;; esac
          v=$(dpkg-deb -f nostr-vault_*_${{ matrix.arch }}.deb Version)
          test "$(ls *.rpm)" = "nostr-vault-$v-1.$m.rpm"
          test "$(ls *.pkg.tar.zst)" = "nostr-vault-$v-1-$m.pkg.tar.zst"
          # The same files in all three (the units under /usr/lib in the two others, for their /lib symlink).
          dpkg-deb -c nostr-vault_*.deb | awk '$1 !~ /^d/ {print $NF}' | sed 's|^\./|/|; s|^/lib/systemd|/usr/lib/systemd|' | sort >deb.list
          rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' *.rpm | awk '$1 !~ /^d/ {print $2}' | sort >rpm.list
          tar --zstd -tf *.pkg.tar.zst | grep -v '/$' | grep -v '^\.' | sed 's|^|/|' | sort >arch.list
          wc -l deb.list rpm.list arch.list
          diff deb.list rpm.list && diff deb.list arch.list
          rm deb.list rpm.list arch.list
      - uses: actions/upload-artifact@v4
        with:
          name: nostr-vault-deb-${{ matrix.arch }}
          path: linux/native/out/
          retention-days: 14

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: linux/native/test
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nostr-vault-deb-${{ matrix.arch }}
          path: debs
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Throwaway-key tool
        run: cd linux/native/test/keytool && go build -o "$RUNNER_TEMP/keytool" .
      - name: Check the download against the manifest
        run: cd debs && python3 -c 'import json,hashlib; m=json.load(open("nostr-vault-linux.json")); assert m["files"]; [print(f, "ok") if hashlib.sha256(open(f,"rb").read()).hexdigest()==h else exit(f+" sha mismatch") for f,h in m["files"].items()]'
      - name: Install test (headless)
        run: sudo KT="$RUNNER_TEMP/keytool" sh linux/native/test/install-test.sh debs/nostr-vault_*_${{ matrix.arch }}.deb headless

  # The .rpm on Fedora and the Arch package on Arch, each arch on its own runner, in a container that boots systemd.
  # install-test.sh as for the .deb (install, setup, reinstall, remove), then install again over the kept settings
  # and restart the container: the vault and its mesh must come back on their own, as after a reboot.
  install-test-rpm-arch:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: fedora, arch: amd64, runner: ubuntu-24.04, image: "fedora:latest", pkg: "*.x86_64.rpm" }
          - { distro: fedora, arch: arm64, runner: ubuntu-24.04-arm, image: "fedora:latest", pkg: "*.aarch64.rpm" }
          - { distro: arch, arch: amd64, runner: ubuntu-24.04, image: "archlinux:latest", pkg: "*-x86_64.pkg.tar.zst" }
          # Arch Linux ARM: no official image; menci/archlinuxarm is rebuilt daily from its official tarball.
          - { distro: arch, arch: arm64, runner: ubuntu-24.04-arm, image: "menci/archlinuxarm:latest", pkg: "*-aarch64.pkg.tar.zst" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: linux/native/test
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nostr-vault-deb-${{ matrix.arch }}
          path: pkgs
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Throwaway-key tool (static, for the container)
        run: cd linux/native/test/keytool && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/keytool" .
      - name: Boot a ${{ matrix.distro }} container with systemd
        run: |
          case ${{ matrix.distro }} in
            fedora) prep='dnf install -y -q systemd procps-ng iproute util-linux curl findutils && dnf clean all' ;;
            # pacman's download sandbox (Landlock) can't start inside docker build.
            arch) prep="sed -i -e 's/^CheckSpace/#CheckSpace/' -e '/^\\[options\\]/a DisableSandbox' /etc/pacman.conf && pacman -Syu --noconfirm --needed systemd procps-ng iproute2 util-linux curl findutils && pacman -Scc --noconfirm" ;;
          esac
          printf 'FROM %s\nRUN %s\n' "${{ matrix.image }}" "$prep" | docker build -t nv-test -
          docker run -d --name nv --privileged --cgroupns=private --stop-signal SIGRTMIN+3 -e container=docker \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp -v "$PWD:/w:ro" -v "$RUNNER_TEMP/keytool:/usr/local/bin/keytool:ro" \
            nv-test /usr/lib/systemd/systemd
          for i in $(seq 1 30); do case $(docker exec nv systemctl is-system-running --wait 2>/dev/null) in running|degraded) break ;; esac; sleep 1; done
          docker exec nv sh -c '. /etc/os-release; echo "$PRETTY_NAME $(uname -m)"'
      - name: Install test (headless)
        run: |
          p=$(cd pkgs && ls ${{ matrix.pkg }}); echo "$p"
          docker exec nv env KT=/usr/local/bin/keytool sh /w/linux/native/test/install-test.sh "/w/pkgs/$p" headless
      - name: Start at boot
        run: |
          p=$(cd pkgs && ls ${{ matrix.pkg }})
          case ${{ matrix.distro }} in
            fedora) docker exec nv dnf install -y -q --setopt=install_weak_deps=False "/w/pkgs/$p" ;;
            arch) docker exec nv pacman -U --noconfirm "/w/pkgs/$p" ;;
          esac
          docker exec nv systemctl -q is-enabled nostr-vault nostr-vault-mesh
          docker stop -t 60 nv && docker start nv
          # Up to 3 minutes: the units wait for network-online.target, which a container may reach only when
          # systemd-networkd-wait-online gives up (2 minutes), as on a real machine with no network manager.
          for i in $(seq 1 30); do case $(docker exec nv systemctl is-system-running --wait 2>/dev/null) in running|degraded) break ;; esac; sleep 1; done
          docker exec nv sh -c 'systemctl list-jobs --no-pager
            for i in $(seq 1 90); do
              if systemctl -q is-active nostr-vault nostr-vault-mesh && curl -fsS http://127.0.0.1:8080/ | grep -qi "<html"; then
                echo "PASS: vault and mesh came back on boot, web app served"; exit 0
              fi
              sleep 2
            done
            echo "FAIL: not back after boot"; systemctl list-jobs --no-pager; systemctl status --no-pager nostr-vault nostr-vault-mesh nostr-vault-prepare
            journalctl -b --no-pager -u nostr-vault -u nostr-vault-mesh -u nostr-vault-prepare -n 60; exit 1'
      - name: Container log
        if: failure()
        run: docker logs nv 2>&1 | tail -80 || true

  # The release's file set: both .debs and ONE manifest listing both (each build job's manifest names only its own).
  release-files:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nostr-vault-deb-*
          path: parts
      - name: Merge the manifests
        run: |
          mkdir out && cp parts/*/*.deb out/ # the .deb release only: the .rpm and Arch package aren't released yet
          python3 -I - parts/*/nostr-vault-linux.json <<'PY'
          import hashlib, json, sys
          ms = [json.load(open(p)) for p in sys.argv[1:]]
          vs = {m["version"] for m in ms}
          assert len(vs) == 1, f"the arches built different versions: {vs}"
          files = {}
          for m in ms: files.update(m["files"])
          assert len(files) == 2, files
          for f, h in files.items():
              assert hashlib.sha256(open("out/" + f, "rb").read()).hexdigest() == h, f
          json.dump({"version": vs.pop(), "files": dict(sorted(files.items()))}, open("out/nostr-vault-linux.json", "w"), indent=1)
          PY
          cat out/nostr-vault-linux.json; ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: nostr-vault-linux-release-files
          path: out/
          retention-days: 14

  # The installer people run (linux/install.sh), from a folder (NV_DEB_DIR) holding the merged release files.
  installer-test:
    needs: release-files
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: linux
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nostr-vault-linux-release-files
          path: rel
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: cd linux/native/test/keytool && go build -o "$RUNNER_TEMP/keytool" .
      - name: A wrong NV_RELEASE with NV_NATIVE=1 stops, and never falls back to Docker
        run: |
          set -- $("$RUNNER_TEMP/keytool" gen); npub=$2
          had_docker=$(command -v docker >/dev/null && echo 1 || echo 0)
          if NV_NATIVE=1 NV_RELEASE=https://github.com/btcforplebs/nostr-vault/releases/download/no-such-tag \
            NV_OWNER=$npub NV_DATA_HOST=/var/lib/nostr-vault NV_DESKTOP=0 NV_YES=1 sh linux/install.sh >out.log 2>&1; then
            cat out.log; echo "install.sh succeeded with a tag that doesn't exist"; exit 1
          fi
          cat out.log
          grep -q "couldn't get the release manifest" out.log
          # (not `! cmd`: bash -e ignores a negated command's failure)
          if grep -qi docker out.log; then echo "it went to Docker"; exit 1; fi
          if dpkg -s nostr-vault >/dev/null 2>&1; then echo "it installed something"; exit 1; fi
          echo "stopped as it should; runner had docker before: $had_docker"
      - name: install.sh, unattended, from the folder
        run: |
          set -- $("$RUNNER_TEMP/keytool" gen); npub=$2
          NV_DEB_DIR="$PWD/rel" NV_OWNER=$npub NV_DATA_HOST=/var/lib/nostr-vault NV_DESKTOP=0 NV_YES=1 sh linux/install.sh
          sleep 8
          want=$(python3 -c 'import json; print(json.load(open("rel/nostr-vault-linux.json"))["version"])')
          got=$(dpkg-query -W -f '${Version}' nostr-vault)
          echo "installed $got, manifest $want"; test -n "$want"; test "$got" = "$want"
          systemctl is-active nostr-vault nostr-vault-mesh
          grep -x "NV_OWNER=$npub" /etc/nostr-vault/vault.env
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<html'
          echo "installer path OK on $(uname -m)"
