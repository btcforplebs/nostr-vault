[package]
name = "fips-bridge-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "fips_bridge_ffi"
# staticlib for Apple targets; cdylib is what Android will consume later.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fips-bridge-core = { path = "../fips-bridge-core" }
fips-endpoint.workspace = true
tokio.workspace = true
anyhow.workspace = true
